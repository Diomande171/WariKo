<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Mon profil</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .profile-header {
            background: var(--violet-fonce);
            color: var(--blanc);
            padding: 22px 20px 34px;
            border-radius: 0 0 30px 30px;
            text-align: center;
        }

        .profile-header .back-button {
            display: block;
            text-align: left;
            color: var(--blanc);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 84px;
            margin: 10px auto 0;
        }

        .avatar {
            width: 84px;
            height: 84px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: var(--jaune);
            color: var(--violet-fonce);

            font-size: 30px;
            font-weight: 800;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-edit {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--violet-fonce);
            border: 2px solid var(--blanc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        .avatar-edit input {
            display: none;
        }

        .profile-header h1 {
            margin-top: 14px;
            font-size: 20px;
        }

        .profile-header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .verif-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .verif-badge.approuve {
            background: rgba(0, 200, 100, 0.2);
            color: #00c864;
        }

        .verif-badge.en_attente {
            background: rgba(255, 209, 0, 0.2);
            color: var(--jaune);
        }

        .verif-badge.refuse {
            background: rgba(255, 60, 60, 0.2);
            color: #ff5c5c;
        }

        .verif-badge.aucune {
            background: rgba(255, 255, 255, 0.12);
            color: var(--blanc);
        }

        .profile-form {
            padding: 24px 20px;
        }

        .profile-form label {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            color: var(--gris-texte);
        }

        .profile-form input {
            width: 100%;
            margin-top: 8px;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #EEEEEE;
            background: var(--gris);
            color: var(--texte);
            outline: none;
        }

        .profile-form input:disabled {
            color: var(--gris-texte);
            background: #EFEFEF;
        }

        .save-button {
            width: 100%;
            margin-top: 26px;
            padding: 15px;
            border-radius: 14px;
            background: var(--violet-fonce);
            color: var(--blanc);
            font-weight: 700;
            font-size: 15px;
            text-align: center;
        }

        .verif-link-button {
            display: block;
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border-radius: 14px;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-weight: 800;
            font-size: 14px;
            text-align: center;
            text-decoration: none;
        }

        .logout-button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #E23744;
            background: transparent;
            color: #E23744;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
        }

        #status-message {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="profile-header">

            <a href="accueil.html" class="back-button">← Retour</a>

            <div class="avatar-wrapper">
                <div class="avatar" id="avatar-display">
                    <span id="avatar-initials">?</span>
                </div>
                <label class="avatar-edit">
                    📷
                    <input type="file" id="avatar-input" accept="image/*">
                </label>
            </div>

            <h1 id="profile-name">Chargement...</h1>
            <p id="profile-email"></p>

            <span class="verif-badge" id="verifBadge" style="display:none;"></span>

        </header>


        <section class="profile-form">

            <form id="profile-form">

                <label for="fullname">Nom complet</label>
                <input id="fullname" type="text" required>

                <label for="phone">Téléphone</label>
                <input id="phone" type="tel" required>

                <label for="email">E-mail</label>
                <input id="email" type="email" disabled>

                <p id="status-message"></p>

                <button type="submit" class="save-button">
                    Enregistrer les modifications
                </button>

            </form>

            <a href="verification.html" class="verif-link-button" id="verifLinkButton">
                🪪 Vérifier mon identité
            </a>

            <button id="logout-btn" class="logout-button">
                Se déconnecter
            </button>

        </section>


        <nav class="bottom-nav">

            <a href="accueil.html">
                🏠
                <span>Accueil</span>
            </a>

            <a href="recherche.html">
                🔍
                <span>Recherche</span>
            </a>

            <a href="messages.html">
                💬
                <span>Messages</span>
            </a>

            <a href="marketplace.html">
                🛍️
                <span>Marketplace</span>
            </a>

            <a href="#">
                📦
                <span>Commandes</span>
            </a>

            <a href="profil.html" class="active">
                👤
                <span>Profil</span>
            </a>

        </nav>

    </div>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById("profile-form");
        const statusMessage = document.getElementById("status-message");
        const avatarDisplay = document.getElementById("avatar-display");
        const avatarInput = document.getElementById("avatar-input");
        const verifBadge = document.getElementById("verifBadge");
        const verifLinkButton = document.getElementById("verifLinkButton");

        let userId = null;

        function afficherAvatar(url, fullName) {
            if (url) {
                avatarDisplay.innerHTML = `<img src="${url}" alt="Photo de profil">`;
            } else {
                const initials = fullName
                    ? fullName.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase()
                    : "?";
                avatarDisplay.innerHTML = `<span id="avatar-initials">${initials}</span>`;
            }
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "connexion.html";
                return;
            }

            const user = session.user;
            userId = user.id;

            const fullName = user.user_metadata.full_name || "";
            const phone = user.user_metadata.phone || "";
            const email = user.email;
            const avatarUrl = user.user_metadata.avatar_url || "";

            document.getElementById("fullname").value = fullName;
            document.getElementById("phone").value = phone;
            document.getElementById("email").value = email;

            document.getElementById("profile-name").textContent = fullName || "Utilisateur WariKo";
            document.getElementById("profile-email").textContent = email;

            afficherAvatar(avatarUrl, fullName);

            // Statut de vérification d'identité
            const { data: verif } = await supabaseClient
                .from("verifications_identite")
                .select("statut")
                .eq("user_id", userId)
                .maybeSingle();

            const labels = {
                approuve: "✅ Identité vérifiée",
                en_attente: "⏳ Vérification en cours",
                refuse: "❌ Document refusé"
            };

            if (verif) {
                verifBadge.textContent = labels[verif.statut];
                verifBadge.className = "verif-badge " + verif.statut;
                verifBadge.style.display = "inline-block";

                if (verif.statut === "approuve") {
                    verifLinkButton.style.display = "none";
                } else if (verif.statut === "en_attente") {
                    verifLinkButton.style.display = "none";
                }
            }
        })();

        avatarInput.addEventListener("change", async () => {
            const fichier = avatarInput.files[0];
            if (!fichier || !userId) return;

            avatarDisplay.style.opacity = "0.5";

            try {
                const chemin = `${userId}/avatar_${Date.now()}.${fichier.name.split('.').pop()}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from("avatars")
                    .upload(chemin, fichier);

                if (uploadError) {
                    alert("Erreur upload : " + uploadError.message);
                    avatarDisplay.style.opacity = "1";
                    return;
                }

                const { data: urlData } = supabaseClient.storage
                    .from("avatars")
                    .getPublicUrl(chemin);

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    data: { avatar_url: urlData.publicUrl }
                });

                if (updateError) {
                    alert("Erreur : " + updateError.message);
                    avatarDisplay.style.opacity = "1";
                    return;
                }

                const fullName = document.getElementById("fullname").value;
                afficherAvatar(urlData.publicUrl, fullName);
                avatarDisplay.style.opacity = "1";

            } catch (err) {
                alert("Erreur inattendue : " + err.message);
                avatarDisplay.style.opacity = "1";
            }
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            statusMessage.textContent = "";
            statusMessage.style.color = "green";

            const fullname = document.getElementById("fullname").value;
            const phone = document.getElementById("phone").value;

            const { error } = await supabaseClient.auth.updateUser({
                data: {
                    full_name: fullname,
                    phone: phone
                }
            });

            if (error) {
                statusMessage.style.color = "red";
                statusMessage.textContent = "Erreur : " + error.message;
            } else {
                statusMessage.style.color = "green";
                statusMessage.textContent = "Profil mis à jour ✓";

                document.getElementById("profile-name").textContent = fullname;
                const avatarImg = avatarDisplay.querySelector("img");
                if (!avatarImg) {
                    afficherAvatar(null, fullname);
                }
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "connexion.html";
        });
    </script>

</body>

</html>
