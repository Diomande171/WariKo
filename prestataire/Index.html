<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WariKo - Espace Prestataire</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .header {
            padding: 22px 20px 18px;
            color: var(--blanc);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar .gauche {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-bar .retour {
            font-size: 20px;
            text-decoration: none;
            color: var(--jaune);
        }

        .header .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--jaune);
        }

        .top-bar .notification {
            font-size: 18px;
            text-decoration: none;
            color: inherit;
        }

        .header h1 {
            margin-top: 10px;
            font-size: 20px;
        }

        .header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .section {
            padding: 10px 20px;
        }

        .demande-card {
            background: var(--jaune);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .demande-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .demande-card h3 {
            font-size: 14px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .demande-card .badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--violet-fonce);
            color: var(--jaune);
            white-space: nowrap;
        }

        .demande-card .categorie-tag {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--violet-fonce);
            opacity: 0.75;
        }

        .demande-card p.description {
            margin-top: 8px;
            font-size: 13px;
            color: var(--violet-fonce);
            opacity: 0.9;
            line-height: 1.4;
        }

        .demande-card .infos {
            margin-top: 10px;
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.7;
        }

        .demande-card .actions {
            margin-top: 14px;
            display: flex;
            gap: 10px;
        }

        .demande-card button {
            flex: 1;
            border: none;
            border-radius: 10px;
            padding: 10px;
            font-size: 13px;
            font-weight: 800;
        }

        .btn-accepter {
            background: var(--violet-fonce);
            color: var(--jaune);
        }

        .btn-refuser {
            background: var(--blanc);
            color: var(--violet-fonce);
        }

        .empty {
            color: var(--blanc);
            opacity: 0.6;
            text-align: center;
            padding: 50px 20px;
            font-size: 13px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            background: var(--violet-fonce);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .bottom-nav a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 11px;
            text-align: center;
        }

        .bottom-nav a.active {
            color: var(--jaune);
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="header">
            <div class="top-bar">
                <div class="gauche">
                    <a href="javascript:history.back()" class="retour">←</a>
                    <div class="logo">WariKo Pro</div>
                </div>
                <a href="../notifications.html" class="notification">🔔</a>
            </div>
            <h1 id="titre-bienvenue">Mes demandes</h1>
            <p>Toutes tes demandes clients en un coup d'œil</p>
        </header>

        <section class="section" id="liste-demandes">
            <p class="empty">Chargement...</p>
        </section>

    </div>


    <nav class="bottom-nav">
        <a href="index.html" class="active">🏠<br>Accueil</a>
        <a href="position.html">📍<br>Position</a>
        <a href="profil.html">👤<br>Profil</a>
    </nav>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const container = document.getElementById("liste-demandes");

        let monNomComplet = "";

        function badgeLabel(statut) {
            if (statut === "acceptee") return "Acceptée";
            if (statut === "refusee") return "Refusée";
            return "En attente";
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "../client/connexion.html";
                return;
            }

            monNomComplet = session.user.user_metadata.full_name || "";
            document.getElementById("titre-bienvenue").textContent = "Bonjour, " + (monNomComplet.split(" ")[0] || "Prestataire");

            chargerDemandes();
        })();

        async function chargerDemandes() {
            const { data, error } = await supabaseClient
                .from("demandes")
                .select("*")
                .eq("professionnel_nom", monNomComplet)
                .order("created_at", { ascending: false });

            if (error) {
                container.innerHTML = '<p class="empty">Erreur : ' + error.message + '</p>';
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = '<p class="empty">Aucune demande pour le moment</p>';
                return;
            }

            container.innerHTML = data.map(function (d) {
                const enAttente = !d.statut || d.statut === "en_attente";
                return `
                    <div class="demande-card">
                        <div class="top-row">
                            <h3>${d.client_nom || "Client"}</h3>
                            <span class="badge">${badgeLabel(d.statut)}</span>
                        </div>
                        <span class="categorie-tag">📂 ${d.categorie || "-"}</span>
                        <p class="description">${d.description || ""}</p>
                        <div class="infos">📞 ${d.client_telephone || "-"}</div>
                        ${enAttente ? `
                        <div class="actions">
                            <button class="btn-accepter" onclick="mettreAJourStatut('${d.id}', 'acceptee')">Accepter</button>
                            <button class="btn-refuser" onclick="mettreAJourStatut('${d.id}', 'refusee')">Refuser</button>
                        </div>` : ""}
                    </div>
                `;
            }).join("");
        }

        async function mettreAJourStatut(id, statut) {
            const { error } = await supabaseClient
                .from("demandes")
                .update({ statut: statut })
                .eq("id", id);

            if (error) {
                alert("Erreur : " + error.message);
                return;
            }
            chargerDemandes();
        }
    </script>

</body>

</html>
