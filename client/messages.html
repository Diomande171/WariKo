<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WariKo - Mes messages</title>

    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background: var(--violet-fonce); }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .header { padding: 22px 20px 18px; color: var(--blanc); }

        h1 { font-size: 19px; font-weight: 800; margin-top: 8px; }

        .conv-card {
            display: block;
            background: var(--jaune);
            border-radius: 14px;
            padding: 14px 16px;
            margin: 0 20px 12px;
            text-decoration: none;
        }

        .conv-nom {
            font-size: 14px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .conv-apercu {
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.75;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty {
            color: var(--blanc);
            opacity: 0.6;
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
        }
    </style>

</head>

<body>

    <div class="app">
        <header class="header">
            <a href="accueil.html" class="back-link" style="color:var(--blanc);opacity:0.75;text-decoration:none;font-size:13px;">← Accueil</a>
            <h1>Mes messages</h1>
        </header>

        <div id="listeConversations">
            <p class="empty">Chargement...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const listeConversations = document.getElementById("listeConversations");

        async function init() {
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                window.location.href = "connexion.html";
                return;
            }

            const { data: messages, error } = await supabaseClient
                .from("messages")
                .select("*")
                .eq("client_id", user.id)
                .order("created_at", { ascending: false });

            if (error) {
                listeConversations.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
                return;
            }

            if (!messages || messages.length === 0) {
                listeConversations.innerHTML = '<p class="empty">Aucune conversation pour l\'instant</p>';
                return;
            }

            // Garder uniquement le dernier message par boutique
            const parBoutique = {};
            messages.forEach(m => {
                if (!parBoutique[m.boutique_id]) {
                    parBoutique[m.boutique_id] = m;
                }
            });

            const boutiqueIds = Object.keys(parBoutique);

            const { data: boutiques } = await supabaseClient
                .from("boutiques_publiques")
                .select("*")
                .in("id", boutiqueIds);

            const nomsBoutiques = {};
            (boutiques || []).forEach(b => { nomsBoutiques[b.id] = b.nom_boutique; });

            listeConversations.innerHTML = boutiqueIds.map(id => {
                const dernierMsg = parBoutique[id];
                const nom = nomsBoutiques[id] || "Boutique";
                return `
                    <a href="messagerie.html?boutique=${id}" class="conv-card">
                        <div class="conv-nom">${nom}</div>
                        <div class="conv-apercu">${dernierMsg.contenu}</div>
                    </a>
                `;
            }).join("");
        }

        init();
    </script>

</body>

</html>
