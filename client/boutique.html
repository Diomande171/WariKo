    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const categorieLabels = {
            telephones: "Téléphones",
            mode: "Mode",
            electronique: "Électronique",
            maison: "Maison",
            autre: "Autre"
        };

        const statutLabels = {
            disponible: "Disponible",
            epuise: "Épuisé",
            vendu: "Vendu"
        };

        function formatPrix(prix) {
            return Number(prix).toLocaleString("fr-FR") + " FCFA";
        }

        function estVideo(url) {
            return /\.(mp4|mov|webm)(\?.*)?$/i.test(url || "");
        }

        function formaterNote(valeur) {
            return valeur.toFixed(1).replace(".", ",");
        }

        const params = new URLSearchParams(window.location.search);
        const boutiqueId = params.get("id");
        const cleParnier = "panier_" + boutiqueId;

        const boutiqueHeader = document.getElementById("boutiqueHeader");
        const listeProduits = document.getElementById("listeProduits");
        const galerieBoutique = document.getElementById("galerieBoutique");
        const statutPanier = document.getElementById("statutPanier");
        const btnValiderCommande = document.getElementById("btnValiderCommande");

        let utilisateurActuel = null;
        let boutiqueActuelle = null;
        let estProprietaire = false;

        function chargerPanier() {
            try {
                return JSON.parse(localStorage.getItem(cleParnier)) || [];
            } catch (e) {
                return [];
            }
        }

        function sauvegarderPanier(panier) {
            localStorage.setItem(cleParnier, JSON.stringify(panier));
        }

        function quantiteDans(panier, produitId) {
            const ligne = panier.find(l => l.produit_id === produitId);
            return ligne ? ligne.quantite : 0;
        }

        function changerQuantite(produit, delta) {
            let panier = chargerPanier();
            let ligne = panier.find(l => l.produit_id === produit.id);
            if (!ligne) {
                if (delta > 0) {
                    panier.push({ produit_id: produit.id, nom: produit.nom, prix: produit.prix, quantite: 1 });
                }
            } else {
                ligne.quantite += delta;
                if (ligne.quantite <= 0) {
                    panier = panier.filter(l => l.produit_id !== produit.id);
                }
            }
            sauvegarderPanier(panier);
            mettreAJourAffichage();
        }

        function mettreAJourAffichage() {
            const panier = chargerPanier();
            document.querySelectorAll(".qte-valeur").forEach(el => {
                const id = el.dataset.produit;
                el.textContent = quantiteDans(panier, id);
            });

            const barrePanier = document.getElementById("barrePanier");
            const totalArticles = panier.reduce((s, l) => s + l.quantite, 0);
            const totalPrix = panier.reduce((s, l) => s + l.quantite * Number(l.prix), 0);

            if (totalArticles > 0) {
                barrePanier.style.display = "flex";
                document.getElementById("texteBarrePanier").textContent = totalArticles + (totalArticles > 1 ? " articles" : " article");
                document.getElementById("totalBarrePanier").textContent = formatPrix(totalPrix);
            } else {
                barrePanier.style.display = "none";
            }
        }

        function ouvrirPanier() {
            const panier = chargerPanier();
            const contenu = document.getElementById("contenuPanier");

            if (panier.length === 0) {
                contenu.innerHTML = '<p class="empty">Panier vide</p>';
            } else {
                contenu.innerHTML = panier.map(l => `
                    <div class="ligne-panier">
                        <span class="nom">${l.nom} × ${l.quantite}</span>
                        <span class="prix">${formatPrix(l.quantite * l.prix)}</span>
                    </div>
                `).join("");
            }

            const total = panier.reduce((s, l) => s + l.quantite * Number(l.prix), 0);
            document.getElementById("totalFeuille").textContent = formatPrix(total);
            statutPanier.textContent = "";
            document.getElementById("overlayPanier").style.display = "block";
        }

        function fermerPanier() {
            document.getElementById("overlayPanier").style.display = "none";
        }

        function fermerPanierClic(e) {
            if (e.target.id === "overlayPanier") fermerPanier();
        }

        async function validerCommande() {
            const panier = chargerPanier();
            if (panier.length === 0) return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "connexion.html";
                return;
            }

            // Position obligatoire avant tout envoi de commande
            let position;
            try {
                statutPanier.style.color = "#FFFFFF";
                statutPanier.textContent = "Localisation en cours...";
                position = await exigerPosition();
            } catch (err) {
                statutPanier.style.color = "#FFD6D6";
                statutPanier.textContent = "⚠️ " + err.message;
                return;
            }

            btnValiderCommande.disabled = true;
            btnValiderCommande.textContent = "Envoi en cours...";
            statutPanier.textContent = "";

            const total = panier.reduce((s, l) => s + l.quantite * Number(l.prix), 0);

            const { data: commande, error } = await supabaseClient
                .from("commandes")
                .insert({
                    boutique_id: boutiqueActuelle.id,
                    client_id: session.user.id,
                    vendeur_id: boutiqueActuelle.user_id,
                    statut: "en_attente",
                    total: total,
                    client_nom: session.user.user_metadata?.full_name || "Client",
                    client_lat: position.lat,
                    client_lng: position.lng
                })
                .select()
                .single();

            if (error) {
                btnValiderCommande.disabled = false;
                btnValiderCommande.textContent = "Envoyer la commande au vendeur";
                statutPanier.style.color = "#FFD6D6";
                statutPanier.textContent = "Erreur : " + error.message;
                return;
            }

            const lignes = panier.map(l => ({
                commande_id: commande.id,
                produit_id: l.produit_id,
                nom_produit: l.nom,
                prix_unitaire: l.prix,
                quantite: l.quantite
            }));

            const { error: errLignes } = await supabaseClient.from("commande_produits").insert(lignes);

            btnValiderCommande.disabled = false;
            btnValiderCommande.textContent = "Envoyer la commande au vendeur";

            if (errLignes) {
                statutPanier.style.color = "#FFD6D6";
                statutPanier.textContent = "Erreur lors de l'envoi du détail : " + errLignes.message;
                return;
            }

            localStorage.removeItem(cleParnier);
            statutPanier.style.color = "#D6FFD6";
            statutPanier.textContent = "Commande envoyée ✓";
            mettreAJourAffichage();
            setTimeout(() => {
                fermerPanier();
            }, 1200);
        }

        async function chargerGalerie() {
            const { data } = await supabaseClient
                .from("boutique_medias")
                .select("*")
                .eq("boutique_id", boutiqueId)
                .order("created_at", { ascending: false });

            if (!data || data.length === 0) {
                galerieBoutique.innerHTML = "";
                return;
            }

            galerieBoutique.innerHTML = data.map(m => `
                <div class="galerie-item">
                    ${m.type === "video"
                        ? `<video src="${m.url}" muted playsinline></video>`
                        : `<img src="${m.url}" alt="photo boutique">`}
                </div>
            `).join("");
        }

        async function chargerBoutique() {
            if (!boutiqueId) {
                boutiqueHeader.innerHTML = '<p class="empty" style="padding:0;">Boutique introuvable</p>';
                listeProduits.innerHTML = "";
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            utilisateurActuel = session ? session.user : null;

            try {
                const { data: boutique, error } = await supabaseClient
                    .from("boutiques_publiques")
                    .select("*")
                    .eq("id", boutiqueId)
                    .maybeSingle();

                if (error) {
                    boutiqueHeader.innerHTML = `<p class="empty" style="padding:0;">Erreur : ${error.message}</p>`;
                    listeProduits.innerHTML = "";
                    return;
                }

                if (!boutique) {
                    boutiqueHeader.innerHTML = '<p class="empty" style="padding:0;">Boutique introuvable</p>';
                    listeProduits.innerHTML = "";
                    return;
                }

                boutiqueActuelle = boutique;
                estProprietaire = utilisateurActuel && utilisateurActuel.id === boutique.user_id;

                const boutonsAction = estProprietaire
                    ? `<a href="../vendeur/ajouter-produit.html?boutique=${boutique.id}" class="contact-btn">+ Ajouter un produit</a>
                       <a href="../vendeur/mes-produits.html?boutique=${boutique.id}" class="contact-btn secondaire">Gérer mes produits</a>
                       <a href="../vendeur/galerie-boutique.html?boutique=${boutique.id}" class="contact-btn secondaire">📷 Photos & vidéos</a>`
                    : `<a href="messagerie.html?boutique=${boutique.id}" class="contact-btn">💬 Contacter le vendeur</a>
                       <a href="livraison.html?boutique=${boutique.id}" class="contact-btn secondaire">🛵 Demander une livraison</a>`;

                boutiqueHeader.innerHTML = `
                    <div class="top-row">
                        <div>
                            <h1>${boutique.nom_boutique}</h1>
                            <span class="categorie-tag">${categorieLabels[boutique.categorie] || boutique.categorie || ""}</span>
                        </div>
                        <span class="badge">Ouverte</span>
                    </div>
                    ${boutique.description ? `<p class="description">${boutique.description}</p>` : ""}
                    <div class="rating-line" id="ratingLigneHeader"></div>
                    ${boutonsAction}
                `;

                chargerGalerie();
                chargerProduits(boutique.id);
                initialiserAvis();
            } catch (e) {
                boutiqueHeader.innerHTML = `<p class="empty" style="padding:0;">Exception : ${e.message}</p>`;
                listeProduits.innerHTML = "";
            }
        }

        async function chargerProduits(id) {
            const { data, error } = await supabaseClient
                .from("produits")
                .select("*")
                .eq("boutique_id", id)
                .order("id", { ascending: false });

            if (error) {
                listeProduits.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                listeProduits.innerHTML = '<p class="empty">Aucun produit pour l\'instant</p>';
                return;
            }

            listeProduits.innerHTML = data.map((p) => {
                const statut = p.statut || "disponible";
                const disponible = statut === "disponible";

                let media = "";
                if (p.image_url) {
                    media = estVideo(p.image_url)
                        ? `<video class="produit-media" src="${p.image_url}" controls></video>`
                        : `<img class="produit-media" src="${p.image_url}" alt="${p.nom}">`;
                }

                const controlePanier = (!estProprietaire && disponible) ? `
                    <div class="panier-controle">
                        <button class="qte-btn" onclick='changerQuantite(${JSON.stringify(p)}, -1)'>−</button>
                        <span class="qte-valeur" data-produit="${p.id}">0</span>
                        <button class="qte-btn" onclick='changerQuantite(${JSON.stringify(p)}, 1)'>+</button>
                    </div>
                ` : "";

                return `
                    <div class="produit-card">
                        ${media}
                        <div class="produit-top">
                            <div class="produit-nom">${p.nom}</div>
                            <div class="produit-prix">${formatPrix(p.prix)}</div>
                        </div>
                        ${p.description ? `<div class="produit-desc">${p.description}</div>` : ""}
                        <div class="produit-statut ${statut}">${statutLabels[statut] || statut}</div>
                        ${controlePanier}
                    </div>
                `;
            }).join("");

            mettreAJourAffichage();
        }

        /* ================= AVIS ================= */

        let noteSelectionnee = 0;
        let dejaLaisseAvis = false;

        function afficherEtoiles(note, taille) {
            const pleines = Math.round(note);
            let html = "";
            for (let i = 1; i <= 5; i++) {
                html += i <= pleines ? "⭐" : "☆";
            }
            return html;
        }

        async function chargerAvis() {
            const listeAvis = document.getElementById("listeAvis");
            const avisResume = document.getElementById("avisResume");
            const avisResumeTexte = document.getElementById("avisResumeTexte");
            const avisNoteBadge = document.getElementById("avisNoteBadge");
            const ratingLigneHeader = document.getElementById("ratingLigneHeader");

            const { data, error } = await supabaseClient
                .from("avis")
                .select("note, commentaire, created_at")
                .eq("cible_type", "boutique")
                .eq("cible_id", String(boutiqueId))
                .order("created_at", { ascending: false });

            if (error || !data) {
                listeAvis.innerHTML = '<p class="empty">Impossible de charger les avis</p>';
                return;
            }

            avisResume.style.display = "flex";

            if (data.length === 0) {
                avisResumeTexte.textContent = "Pas encore d'avis";
                avisNoteBadge.style.display = "none";
                if (ratingLigneHeader) ratingLigneHeader.innerHTML = "";
                listeAvis.innerHTML = '<p class="empty">Aucun avis pour l\'instant</p>';
                return;
            }

            const moyenne = data.reduce((s, a) => s + a.note, 0) / data.length;

            avisResumeTexte.textContent = `${data.length} avis`;
            avisNoteBadge.textContent = formaterNote(moyenne);
            avisNoteBadge.style.display = "inline-block";

            if (ratingLigneHeader) {
                ratingLigneHeader.innerHTML = `
                    <span>${afficherEtoiles(moyenne)}</span>
                    <span class="note-badge">${formaterNote(moyenne)} (${data.length} avis)</span>
                `;
            }

            listeAvis.innerHTML = data.map(a => `
                <div class="avis-item">
                    <span class="avis-etoiles">${afficherEtoiles(a.note)}</span>
                    ${a.commentaire ? `<div class="avis-commentaire">${a.commentaire}</div>` : ""}
                    <div class="avis-date">${new Date(a.created_at).toLocaleDateString("fr-FR")}</div>
                </div>
            `).join("");
        }

        async function initialiserAvis() {
            chargerAvis();

            const avisCta = document.getElementById("avisCta");

            if (!utilisateurActuel || estProprietaire) {
                avisCta.style.display = "none";
                return;
            }

            // Le client a-t-il déjà une commande livrée pour cette boutique ?
            const { data: commandeLivree } = await supabaseClient
                .from("commandes")
                .select("id")
                .eq("client_id", utilisateurActuel.id)
                .eq("boutique_id", boutiqueId)
                .eq("statut", "livree")
                .limit(1)
                .maybeSingle();

            if (!commandeLivree) {
                avisCta.style.display = "none";
                return;
            }

            // A-t-il déjà laissé un avis ?
            const { data: avisExistant } = await supabaseClient
                .from("avis")
                .select("id")
                .eq("cible_type", "boutique")
                .eq("cible_id", String(boutiqueId))
                .eq("auteur_id", utilisateurActuel.id)
                .limit(1)
                .maybeSingle();

            if (avisExistant) {
                dejaLaisseAvis = true;
                avisCta.style.display = "block";
                avisCta.innerHTML = '<p>Merci, tu as déjà laissé un avis sur cette boutique ✓</p>';
                return;
            }

            avisCta.style.display = "block";
        }

        function ouvrirFormulaireAvis() {
            document.getElementById("avisCta").style.display = "none";
            document.getElementById("avisForm").style.display = "block";
        }

        function fermerFormulaireAvis() {
            document.getElementById("avisForm").style.display = "none";
            document.getElementById("avisCta").style.display = "block";
            document.getElementById("avisCommentaire").value = "";
            document.getElementById("statutAvis").textContent = "";
            noteSelectionnee = 0;
            document.querySelectorAll("#avisEtoilesSelect button").forEach(b => b.classList.remove("actif"));
        }

        document.getElementById("avisEtoilesSelect").addEventListener("click", (e) => {
            const btn = e.target.closest("button[data-note]");
            if (!btn) return;
            noteSelectionnee = Number(btn.dataset.note);
            document.querySelectorAll("#avisEtoilesSelect button").forEach(b => {
                b.classList.toggle("actif", Number(b.dataset.note) <= noteSelectionnee);
            });
        });

        async function envoyerAvis() {
            const statutAvis = document.getElementById("statutAvis");

            if (noteSelectionnee === 0) {
                statutAvis.style.color = "#FFD6D6";
                statutAvis.textContent = "Choisis une note avant d'envoyer";
                return;
            }

            const commentaire = document.getElementById("avisCommentaire").value.trim();

            const { error } = await supabaseClient
                .from("avis")
                .insert({
                    auteur_id: utilisateurActuel.id,
                    cible_type: "boutique",
                    cible_id: String(boutiqueId),
                    note: noteSelectionnee,
                    commentaire: commentaire || null
                });

            if (error) {
                statutAvis.style.color = "#FFD6D6";
                statutAvis.textContent = "Erreur : " + error.message;
                return;
            }

            statutAvis.style.color = "#D6FFD6";
            statutAvis.textContent = "Avis envoyé, merci ✓";
            dejaLaisseAvis = true;

            setTimeout(() => {
                document.getElementById("avisForm").style.display = "none";
                document.getElementById("avisCta").style.display = "block";
                document.getElementById("avisCta").innerHTML = '<p>Merci, tu as déjà laissé un avis sur cette boutique ✓</p>';
                chargerAvis();
            }, 900);
        }

        chargerBoutique();
    </script>
