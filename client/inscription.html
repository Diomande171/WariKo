<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Inscription</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background:
                linear-gradient(rgba(30, 2, 60, 0.55), rgba(30, 2, 60, 0.55)),
                url('../assets/8962F136-B7E6-4C8B-97E9-C462192F9E4E.png') center top / cover no-repeat,
                var(--violet-fonce);
            background-attachment: fixed;
        }

        .auth-content {
            background: rgba(20, 1, 45, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 20px;
        }

        .mascotte-scene {
            position: relative;
            height: 130px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            margin: 8px 0 4px;
            overflow: hidden;
        }

        .mascotte-img {
            height: 120px;
            width: auto;
            transform: translateX(-140%);
            animation: marcherEntree 1.6s ease-out forwards;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }

        .mascotte-img.tape {
            animation: marcherEntree 1.6s ease-out forwards, tapBaton 0.5s ease-in-out 1.6s;
        }

        @keyframes marcherEntree {
            0%   { transform: translateX(-140%) translateY(0); }
            15%  { transform: translateX(-105%) translateY(-6px); }
            30%  { transform: translateX(-70%) translateY(0); }
            45%  { transform: translateX(-40%) translateY(-6px); }
            60%  { transform: translateX(-15%) translateY(0); }
            75%  { transform: translateX(-4%) translateY(-4px); }
            100% { transform: translateX(0) translateY(0); }
        }

        @keyframes tapBaton {
            0%   { transform: translateX(0) rotate(0deg); }
            30%  { transform: translateX(0) rotate(-6deg); }
            55%  { transform: translateX(0) rotate(4deg); }
            80%  { transform: translateX(0) rotate(-2deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }

        .impact-sol {
            position: absolute;
            bottom: 6px;
            left: 50%;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--jaune);
            opacity: 0;
            transform: translateX(-50%) scale(0.3);
        }

        .impact-sol.jouer {
            animation: ondeImpact 0.6s ease-out 1.75s;
        }

        @keyframes ondeImpact {
            0%   { opacity: 0.9; transform: translateX(-50%) scale(0.3); }
            100% { opacity: 0; transform: translateX(-50%) scale(6); }
        }

        .champs-formulaire {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .champs-formulaire.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .primary-button:disabled {
            opacity: 0.6;
        }
    </style>

</head>


<body>

    <main class="auth-page">

        <a
            href="connexion.html"
            class="back-button"
        >
            ← Retour
        </a>

        <div class="mascotte-scene">
            <img id="mascotteImg" class="mascotte-img" src="../assets/7C7C2F57-762E-4827-B116-A06B3047B284.png" alt="Mascotte WariKo">
            <div id="impactSol" class="impact-sol"></div>
        </div>

        <section class="auth-content">

            <h1>
                Créer un compte 🎉
            </h1>

            <p>
                Rejoignez WariKo en quelques secondes.
            </p>


            <form id="signup-form">

                <div id="champsFormulaire" class="champs-formulaire">

                    <label for="fullname">
                        Nom complet
                    </label>

                    <input
                        id="fullname"
                        type="text"
                        placeholder="Votre nom complet"
                        required
                    >


                    <label for="phone">
                        Téléphone
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Ex : 07 00 00 00 00"
                        required
                    >


                    <label for="email">
                        E-mail
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Votre e-mail"
                        required
                    >


                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Choisissez un mot de passe"
                        required
                        minlength="6"
                    >


                    <p id="error-message" style="color: red; display: none;"></p>

                    <p id="success-message" style="color: green; display: none;"></p>


                    <button
                        type="submit"
                        id="submit-button"
                        class="primary-button"
                    >
                        Créer mon compte
                    </button>

                </div>

            </form>


            <div id="basDePage" class="champs-formulaire">

                <div class="auth-divider">
                    <span>OU</span>
                </div>


                <p class="create-text">
                    Vous avez déjà un compte ?
                </p>


                <a
                    href="connexion.html"
                    class="secondary-button"
                >
                    Se connecter
                </a>

            </div>

        </section>


        <p class="auth-footer">
            WariKo protège vos informations personnelles.
        </p>

    </main>


    <script>
        // Animation d'entrée de la mascotte : marche puis tape le bâton au sol
        const mascotteImg = document.getElementById("mascotteImg");
        const impactSol = document.getElementById("impactSol");
        const champsFormulaire = document.getElementById("champsFormulaire");
        const basDePage = document.getElementById("basDePage");

        mascotteImg.classList.add("tape");
        setTimeout(() => impactSol.classList.add("jouer"), 0);

        setTimeout(() => {
            champsFormulaire.classList.add("visible");
            basDePage.classList.add("visible");
        }, 2200);

        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        let supabaseClient = null;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (erreurInit) {
            console.error("Erreur d'initialisation Supabase :", erreurInit);
        }

        const form = document.getElementById("signup-form");
        const errorMessage = document.getElementById("error-message");
        const successMessage = document.getElementById("success-message");
        const submitButton = document.getElementById("submit-button");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            if (!supabaseClient) {
                errorMessage.textContent = "Erreur technique : la connexion au serveur n'a pas pu s'initialiser. Réessaie de recharger la page.";
                errorMessage.style.display = "block";
                return;
            }

            const fullname = document.getElementById("fullname").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            submitButton.disabled = true;
            submitButton.textContent = "Création en cours...";

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullname,
                            phone: phone
                        }
                    }
                });

                if (error) {
                    errorMessage.textContent = "Erreur : " + error.message;
                    errorMessage.style.display = "block";
                    submitButton.disabled = false;
                    submitButton.textContent = "Créer mon compte";
                    return;
                }

                if (data.session) {
                    // Session active tout de suite (confirmation email désactivée) : direction l'accueil
                    successMessage.textContent = "Compte créé ! Bienvenue sur WariKo 🎉";
                    successMessage.style.display = "block";
                    submitButton.textContent = "Redirection...";
                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    // Pas de session : confirmation email requise
                    successMessage.textContent = "Compte créé ! Vérifie ta boîte mail pour confirmer ton compte, puis connecte-toi.";
                    successMessage.style.display = "block";
                    form.reset();
                    submitButton.disabled = false;
                    submitButton.textContent = "Créer mon compte";
                    setTimeout(() => {
                        window.location.href = "connexion.html";
                    }, 2500);
                }

            } catch (erreurReseau) {
                errorMessage.textContent = "Erreur de connexion au serveur. Vérifie ta connexion internet et réessaie. (" + erreurReseau.message + ")";
                errorMessage.style.display = "block";
                submitButton.disabled = false;
                submitButton.textContent = "Créer mon compte";
            }
        });
    </script>

</body>

</html>
