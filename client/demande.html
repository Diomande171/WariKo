<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Demande de prestation</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .demande-header {
            background: var(--violet-fonce);
            color: var(--blanc);
            padding: 22px 20px 20px;
        }

        .demande-header .back-button {
            display: block;
            color: var(--blanc);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        .demande-header h1 {
            font-size: 20px;
        }

        .pro-summary {
            margin: 0 20px 20px;
            background: var(--jaune);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .pro-summary .pro-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--violet-fonce);
            color: var(--jaune);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            flex-shrink: 0;
        }

        .pro-summary .pro-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .pro-summary .pro-category {
            margin-top: 2px;
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.75;
            font-weight: 600;
        }

        .section-titre {
            padding: 0 20px 10px;
            color: var(--blanc);
            font-size: 14px;
            font-weight: 700;
        }

        .liste-services {
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .carte-service-choix {
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 10px;
            border: 2px solid transparent;
        }

        .carte-service-choix.selectionnee {
            border-color: var(--jaune);
            background: rgba(255,212,0,0.12);
        }

        .carte-service-choix img {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            object-fit: cover;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
        }

        .carte-service-choix .vignette-vide {
            width: 56px;
            height: 56px;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .infos-service-choix { flex: 1; min-width: 0; }
        .infos-service-choix h4 {
            color: var(--blanc);
            font-size: 14px;
            margin-bottom: 3px;
        }
        .infos-service-choix .prix-service {
            color: var(--jaune);
            font-size: 13px;
            font-weight: 700;
        }

        .radio-service {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--jaune);
            flex-shrink: 0;
            position: relative;
        }
        .carte-service-choix.selectionnee .radio-service::after {
            content: "";
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            background: var(--jaune);
        }

        .message-aucun-service {
            color: var(--blanc);
            opacity: 0.7;
            font-size: 13px;
            padding: 0 20px 16px;
        }

        .demande-form {
            padding: 0 20px 24px;
        }

        .demande-form label {
            display: block;
            margin-top: 4px;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--blanc);
            opacity: 0.85;
        }

        .demande-form textarea,
        .demande-form input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: none;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-weight: 600;
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .demande-form textarea::placeholder,
        .demande-form input::placeholder {
            color: var(--violet-fonce);
            opacity: 0.55;
            font-weight: 400;
        }

        .demande-form textarea {
            min-height: 100px;
            resize: vertical;
        }

        .field-group {
            margin-bottom: 18px;
        }

        .submit-button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            border-radius: 14px;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-weight: 800;
            font-size: 15px;
            text-align: center;
            border: none;
        }

        .submit-button:disabled {
            opacity: 0.6;
        }

        #status-message {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
            color: var(--blanc);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            background: var(--violet-fonce);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 6px;
        }

        .bottom-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
        }

        .bottom-nav a svg {
            width: 22px;
            height: 22px;
            stroke: rgba(255, 255, 255, 0.6);
        }

        .bottom-nav a.active {
            color: var(--jaune);
        }

        .bottom-nav a.active svg {
            stroke: var(--jaune);
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="demande-header">
            <a href="recherche.html" class="back-button">← Retour</a>
            <h1>Fais ta demande</h1>
        </header>

        <div class="pro-summary">
            <div class="pro-avatar" id="pro-avatar">?</div>
            <div>
                <div class="pro-name" id="pro-name">Professionnel</div>
                <div class="pro-category" id="pro-category">Catégorie</div>
            </div>
        </div>

        <div class="section-titre">Choisis un service</div>
        <div class="liste-services" id="liste-services">
            <p class="message-aucun-service">Chargement des services...</p>
        </div>

        <section class="demande-form">

            <form id="demande-form">

                <div class="field-group">
                    <label for="description">Précise ta demande (optionnel)</label>
                    <textarea
                        id="description"
                        placeholder="Ex : disponible ce soir après 18h, l'adresse exacte est..."
                    ></textarea>
                </div>

                <div class="field-group">
                    <label for="telephone">Ton numéro de téléphone</label>
                    <input
                        id="telephone"
                        type="tel"
                        placeholder="Ex : 07 00 00 00 00"
                        required
                    >
                </div>

                <p id="status-message"></p>

                <button type="submit" class="submit-button" id="submit-btn">
                    Envoyer la demande
                </button>

            </form>

        </section>


        <nav class="bottom-nav">

            <a href="accueil.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <path d="M9 22V12h6v10"/>
                </svg>
                <span>Accueil</span>
            </a>

            <a href="recherche.html" class="active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <span>Recherche</span>
            </a>

            <a href="messagerie.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                </svg>
                <span>Messages</span>
            </a>

            <a href="marketplace.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 2l1.5 4h9L18 2"/>
                    <path d="M4 6h16l-1.5 14a2 2 0 0 1-2 1.8H7.5a2 2 0 0 1-2-1.8L4 6z"/>
                    <path d="M9 10a3 3 0 0 0 6 0"/>
                </svg>
                <span>Marketplace</span>
            </a>

            <a href="commandes.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 8l-9-5-9 5 9 5 9-5z"/>
                    <path d="M3 8v8l9 5 9-5V8"/>
                    <path d="M12 13v8"/>
                </svg>
                <span>Commandes</span>
            </a>

            <a href="profil.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>
                </svg>
                <span>Profil</span>
            </a>

        </nav>

    </div>


    <script src="../assets/position.js"></script>
    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Récupère l'id, le nom et la catégorie du professionnel depuis l'URL
        // (ex: demande.html?prestataire_id=xxx&nom=Koffi%20Aya&categorie=Plomberie)
        const params = new URLSearchParams(window.location.search);
        const prestataireId = params.get("prestataire_id");
        const proNom = params.get("nom") || "Professionnel WariKo";
        const proCategorie = params.get("categorie") || "Service";

        function initials(name) {
            return name.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
        }

        function formatPrix(prix) {
            return Number(prix || 0).toLocaleString("fr-FR") + " FCFA";
        }

        document.getElementById("pro-name").textContent = proNom;
        document.getElementById("pro-category").textContent = proCategorie;
        document.getElementById("pro-avatar").textContent = initials(proNom);

        const form = document.getElementById("demande-form");
        const statusMessage = document.getElementById("status-message");
        const submitBtn = document.getElementById("submit-btn");
        const listeServicesEl = document.getElementById("liste-services");

        let currentUser = null;
        let serviceSelectionneId = null;
        let serviceSelectionneNom = null;

        function afficherServices(services) {
            if (!services || services.length === 0) {
                listeServicesEl.innerHTML = '<p class="message-aucun-service">Ce professionnel n\'a pas encore ajouté de service. Tu peux quand même envoyer une demande générale ci-dessous.</p>';
                return;
            }

            listeServicesEl.innerHTML = services.map(s => `
                <div class="carte-service-choix" data-id="${s.id}" data-nom="${s.nom.replace(/"/g, '&quot;')}" onclick="selectionnerService(${s.id})">
                    ${s.photo_url ? `<img src="${s.photo_url}" alt="${s.nom}">` : `<div class="vignette-vide">🔧</div>`}
                    <div class="infos-service-choix">
                        <h4>${s.nom}</h4>
                        <div class="prix-service">à partir de ${formatPrix(s.prix)}</div>
                    </div>
                    <div class="radio-service"></div>
                </div>
            `).join("");
        }

        function selectionnerService(id) {
            serviceSelectionneId = id;
            document.querySelectorAll(".carte-service-choix").forEach(el => {
                const estCelleCi = Number(el.dataset.id) === id;
                el.classList.toggle("selectionnee", estCelleCi);
                if (estCelleCi) serviceSelectionneNom = el.dataset.nom;
            });
        }

        async function chargerServicesDuPrestataire() {
            if (!prestataireId) {
                listeServicesEl.innerHTML = "";
                return;
            }

            const { data: services, error } = await supabaseClient
                .from("prestataire_services")
                .select("*")
                .eq("prestataire_id", prestataireId)
                .order("created_at", { ascending: false });

            if (error) {
                listeServicesEl.innerHTML = '<p class="message-aucun-service">Erreur de chargement des services.</p>';
                return;
            }

            afficherServices(services);
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "connexion.html";
                return;
            }

            currentUser = session.user;

            const savedPhone = currentUser.user_metadata.phone || "";
            if (savedPhone) {
                document.getElementById("telephone").value = savedPhone;
            }

            chargerServicesDuPrestataire();
        })();

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!currentUser) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "Tu dois être connecté pour envoyer une demande.";
                return;
            }

            if (!prestataireId) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "Erreur : prestataire introuvable. Reviens depuis la recherche.";
                return;
            }

            const description = document.getElementById("description").value.trim();
            const telephone = document.getElementById("telephone").value.trim();

            if (!telephone) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "Merci d'indiquer ton numéro de téléphone.";
                return;
            }

            const aDesServices = document.querySelectorAll(".carte-service-choix").length > 0;
            if (aDesServices && !serviceSelectionneId) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "Merci de choisir un service.";
                return;
            }

            let position;
            try {
                position = await exigerPosition();
            } catch (err) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "⚠️ " + err.message;
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Envoi en cours...";
            statusMessage.textContent = "";

            const { error } = await supabaseClient
                .from("demandes")
                .insert({
                    client_id: currentUser.id,
                    client_nom: currentUser.user_metadata.full_name || "",
                    client_telephone: telephone,
                    prestataire_id: prestataireId,
                    professionnel_nom: proNom,
                    categorie: serviceSelectionneNom || proCategorie,
                    description: description,
                    statut: "en_attente",
                    service_id: serviceSelectionneId,
                    client_lat: position.lat,
                    client_lng: position.lng
                });

            submitBtn.disabled = false;
            submitBtn.textContent = "Envoyer la demande";

            if (error) {
                statusMessage.style.color = "#FFD6D6";
                statusMessage.textContent = "Erreur : " + error.message;
            } else {
                statusMessage.style.color = "#D6FFD6";
                statusMessage.textContent = "Demande envoyée ✓ Le professionnel va être notifié.";
                form.reset();
                setTimeout(() => {
                    window.location.href = "accueil.html";
                }, 1800);
            }
        });
    </script>

</body>

</html>
