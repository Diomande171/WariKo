<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de bord livreur - WariKo</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:16px 16px 90px; }
  .header { display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .avatar { width:52px; height:52px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,0.1); flex-shrink:0; }
  .header-infos { flex:1; min-width:0; }
  .nom-livreur { font-family:'Playfair Display',serif; font-size:16px; font-weight:bold; margin:0; }
  .statut-badge { display:flex; align-items:center; gap:5px; font-size:12px; margin:3px 0; cursor:pointer; }
  .dot { width:7px; height:7px; border-radius:50%; background:#4CAF50; }
  .dot.hors-ligne { background:#888; }
  .note-ligne { font-size:12px; opacity:0.8; }
  .btn-profil { background:rgba(255,255,255,0.1); color:var(--jaune); border:none; border-radius:16px; padding:7px 12px; font-size:11px; white-space:nowrap; }

  .stats-jour { background:rgba(255,255,255,0.06); border-radius:14px; padding:16px; margin-bottom:16px; }
  .stats-jour .label { font-size:12px; opacity:0.7; margin-bottom:10px; }
  .stats-grille { display:flex; justify-content:space-between; text-align:center; }
  .stat-item .valeur { font-size:17px; font-weight:bold; color:var(--jaune); }
  .stat-item .titre { font-size:10.5px; opacity:0.75; margin-top:2px; }

  .btn-action { position:relative; width:100%; display:block; text-align:left; border:none; border-radius:12px; padding:14px 16px; font-size:14px; font-weight:bold; margin-bottom:10px; text-decoration:none; }
  .btn-action.principal { background:var(--jaune); color:var(--violet-fonce); }
  .btn-action.secondaire { background:rgba(255,255,255,0.08); color:var(--blanc); font-weight:600; }
  .badge-compteur { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:#E63946; color:#fff; font-size:11px; font-weight:bold; border-radius:10px; padding:2px 7px; }

  .gains-bloc { background:rgba(255,255,255,0.06); border-radius:14px; padding:14px 16px; margin-top:8px; }
  .gains-haut { display:flex; justify-content:space-between; align-items:center; font-size:13px; }
  .gains-haut a { color:var(--jaune); font-size:12px; text-decoration:none; }
  .gains-montant { font-size:19px; font-weight:bold; color:var(--jaune); margin-top:6px; }
  .gains-souslabel { font-size:11px; opacity:0.7; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div id="contenu">Chargement...</div>

<div class="bottom-nav">
  <a href="index.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 10h3l2 3v4h-5z"/><circle cx="7" cy="19" r="1.5"/><circle cx="18" cy="19" r="1.5"/></svg>
    Livraisons
  </a>
  <a href="#" onclick="pasEncoreDisponible(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="#" onclick="pasEncoreDisponible(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let monLivreur = null;

function pasEncoreDisponible(e) {
  if (e) e.preventDefault();
  alert('🚧 Cette fonctionnalité n\'est pas encore disponible.');
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = '../client/connexion.html';
    return;
  }

  const { data: livreur } = await supabase
    .from('livreurs')
    .select('*')
    .eq('user_id', user.id)
    .single();

  if (!livreur) {
    window.location.href = 'inscription.html';
    return;
  }

  monLivreur = livreur;
  await afficherTableauDeBord();
}

function debutJournee() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

function debutMois() {
  const d = new Date();
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

function montantLivraison(l) {
  if (l.prix_livraison) return l.prix_livraison;
  if (l.distance_km) return Math.round(l.distance_km * 300);
  return 0;
}

function formaterTempsTravail() {
  if (!monLivreur.en_ligne || !monLivreur.en_ligne_depuis) return '0h00';
  const debut = new Date(monLivreur.en_ligne_depuis);
  const diffMin = Math.max(0, Math.floor((Date.now() - debut.getTime()) / 60000));
  const h = Math.floor(diffMin / 60);
  const m = diffMin % 60;
  return `${h}h${m.toString().padStart(2, '0')}`;
}

async function afficherTableauDeBord() {
  const contenu = document.getElementById('contenu');

  const { data: avis } = await supabase
    .from('avis_livreurs')
    .select('note')
    .eq('livreur_id', monLivreur.id);

  const noteMoyenne = avis && avis.length > 0
    ? (avis.reduce((s, a) => s + a.note, 0) / avis.length).toFixed(1)
    : '—';
  const nbAvis = avis ? avis.length : 0;

  const { count: nbLivraisonsTotal } = await supabase
    .from('livraisons')
    .select('*', { count: 'exact', head: true })
    .eq('livreur_id', monLivreur.id)
    .eq('statut', 'livree');

  const { data: livraisonsJour } = await supabase
    .from('livraisons')
    .select('*')
    .eq('livreur_id', monLivreur.id)
    .eq('statut', 'livree')
    .gte('created_at', debutJournee());

  const nbLivraisonsJour = livraisonsJour ? livraisonsJour.length : 0;
  const gainsJour = livraisonsJour ? livraisonsJour.reduce((s, l) => s + montantLivraison(l), 0) : 0;

  const { data: livraisonsMois } = await supabase
    .from('livraisons')
    .select('*')
    .eq('livreur_id', monLivreur.id)
    .eq('statut', 'livree')
    .gte('created_at', debutMois());

  const gainsMois = livraisonsMois ? livraisonsMois.reduce((s, l) => s + montantLivraison(l), 0) : 0;

  const { count: nbNouvellesCourses } = await supabase
    .from('livraisons')
    .select('*', { count: 'exact', head: true })
    .eq('statut', 'en_attente');

  const { count: nbEnCours } = await supabase
    .from('livraisons')
    .select('*', { count: 'exact', head: true })
    .eq('livreur_id', monLivreur.id)
    .in('statut', ['acceptee', 'en_cours']);

  contenu.innerHTML = `
    <div class="header">
      <img class="avatar" src="${monLivreur.photo1_url || ''}" onerror="this.style.opacity=0">
      <div class="header-infos">
        <p class="nom-livreur">${monLivreur.nom_complet || 'Livreur'}</p>
        <div class="statut-badge" onclick="basculerStatut()">
          <span class="dot ${monLivreur.en_ligne ? '' : 'hors-ligne'}"></span>
          ${monLivreur.en_ligne ? 'En ligne' : 'Hors ligne'}
        </div>
        <div class="note-ligne">⭐ ${noteMoyenne} (${nbLivraisonsTotal || 0} livraisons)</div>
      </div>
      <button class="btn-profil" onclick="pasEncoreDisponible()">Mon profil</button>
    </div>

    <div class="stats-jour">
      <div class="label">Aujourd'hui</div>
      <div class="stats-grille">
        <div class="stat-item">
          <div class="valeur">${nbLivraisonsJour}</div>
          <div class="titre">livraisons</div>
        </div>
        <div class="stat-item">
          <div class="valeur">${gainsJour.toLocaleString('fr-FR')} F</div>
          <div class="titre">gains du jour</div>
        </div>
        <div class="stat-item">
          <div class="valeur">${formaterTempsTravail()}</div>
          <div class="titre">temps de travail</div>
        </div>
      </div>
    </div>

    <a href="nouvelles-courses.html" class="btn-action principal">
      Nouvelles courses
      ${nbNouvellesCourses > 0 ? `<span class="badge-compteur">${nbNouvellesCourses}</span>` : ''}
    </a>
    <a href="nouvelles-courses.html?onglet=en_cours" class="btn-action secondaire">
      Mes livraisons en cours
      ${nbEnCours > 0 ? `<span class="badge-compteur">${nbEnCours}</span>` : ''}
    </a>
    <a href="#" class="btn-action secondaire" onclick="pasEncoreDisponible(event)">
      Historique des livraisons
    </a>

    <div class="gains-bloc">
      <div class="gains-haut">
        <span>Mes gains</span>
        <a href="#" onclick="pasEncoreDisponible(event)">Voir tout</a>
      </div>
      <div class="gains-montant">${gainsMois.toLocaleString('fr-FR')} F</div>
      <div class="gains-souslabel">Ce mois-ci</div>
    </div>
  `;
}

async function basculerStatut() {
  const nouveauEnLigne = !monLivreur.en_ligne;
  const updates = { en_ligne: nouveauEnLigne };
  if (nouveauEnLigne) {
    updates.en_ligne_depuis = new Date().toISOString();
  }
  const { error } = await supabase.from('livreurs').update(updates).eq('id', monLivreur.id);
  if (!error) {
    monLivreur.en_ligne = nouveauEnLigne;
    if (nouveauEnLigne) monLivreur.en_ligne_depuis = updates.en_ligne_depuis;
    await afficherTableauDeBord();
  }
}

init();
</script>
</body>
</html>
