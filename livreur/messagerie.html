<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messagerie - WariKo</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="../assets/IMG_9862.png">

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; margin:0; padding:0; }
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding-bottom:110px; }

  .header-chat { display:flex; align-items:center; gap:12px; padding:16px; background:var(--violet-fonce); border-bottom:1px solid rgba(255,255,255,0.1); position:sticky; top:0; z-index:10; }
  .btn-retour { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; color:var(--blanc); text-decoration:none; font-size:17px; flex-shrink:0; }
  .header-textes { min-width:0; }
  .header-chat h2 { font-family:'Playfair Display', serif; font-size:17px; margin:0; }
  .header-sous { font-size:10.5px; opacity:0.6; margin-top:1px; }

  .avertissement { background:rgba(255,193,7,0.12); color:var(--jaune); font-size:11.5px; padding:10px 16px; text-align:center; }

  #messages { padding:16px; display:flex; flex-direction:column; gap:10px; min-height:55vh; }
  .bulle { max-width:75%; padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.4; }
  .bulle.moi { align-self:flex-end; background:var(--jaune); color:var(--violet-fonce); border-bottom-right-radius:4px; }
  .bulle.autre { align-self:flex-start; background:rgba(255,255,255,0.08); color:var(--blanc); border-bottom-left-radius:4px; }
  .bulle img, .bulle video { max-width:100%; border-radius:10px; display:block; margin-bottom:4px; }
  .heure { font-size:10px; opacity:0.6; margin-top:4px; display:block; }

  .zone-saisie { position:fixed; bottom:0; left:0; right:0; max-width:430px; margin:0 auto; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); padding:10px 12px; display:flex; gap:8px; align-items:center; z-index:100; }
  .zone-saisie input[type="text"] { flex:1; border:none; border-radius:20px; padding:12px 16px; background:rgba(255,255,255,0.08); color:var(--blanc); font-size:14px; }
  .zone-saisie input::placeholder { color:rgba(255,255,255,0.5); }
  .zone-saisie button { background:var(--jaune); color:var(--violet-fonce); border:none; border-radius:50%; width:44px; height:44px; font-size:16px; font-weight:bold; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .zone-saisie button svg { width:18px; height:18px; }
  .btn-media { background:rgba(255,255,255,0.1); color:var(--jaune); border:none; border-radius:50%; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .btn-media svg { width:19px; height:19px; }

  .liste-conv { padding:6px 0 20px; }
  .conv-item { display:flex; gap:12px; align-items:center; padding:13px 16px; border-bottom:1px solid rgba(255,255,255,0.06); text-decoration:none; color:var(--blanc); }
  .conv-item:active { background:rgba(255,255,255,0.03); }
  .conv-avatar { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,0.08); color:var(--jaune); display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:16px; flex-shrink:0; }
  .conv-info { flex:1; min-width:0; }
  .conv-info h4 { margin:0; font-size:14px; display:flex; align-items:center; gap:6px; }
  .conv-info p { margin:2px 0 0; font-size:12px; opacity:0.65; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag-role { font-size:9px; font-weight:700; padding:2px 6px; border-radius:6px; }
  .tag-role.pro { background:rgba(255,209,0,0.15); color:var(--jaune); }
  .tag-role.client { background:rgba(100,181,246,0.15); color:#8fc8f5; }
  .conv-heure { font-size:10px; opacity:0.5; white-space:nowrap; }

  .vide { text-align:center; padding:60px 24px; opacity:0.55; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .vide .icone-vide { font-size:34px; opacity:0.5; }
  .envoi-cours { text-align:center; font-size:11.5px; opacity:0.6; padding:6px; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; z-index:100; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div class="header-chat">
  <a class="btn-retour" href="javascript:history.back()">←</a>
  <div class="header-textes">
    <h2 id="titre-chat">Messages</h2>
    <div class="header-sous" id="sous-titre-chat"></div>
  </div>
</div>

<div id="contenu">
  <div class="liste-conv"><p class="vide"><span class="icone-vide">💬</span>Chargement...</p></div>
</div>

<div class="bottom-nav" id="nav-bas">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M9 18h4.5l1.5-4h3l2 3"/><path d="M4 14l3-6h4l2 3h2.5"/><path d="M13 8h2.5l1.5 3"/></svg>
    Livraisons
  </a>
  <a href="portefeuille.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="profil.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const params = new URLSearchParams(window.location.search);
const livraisonId = params.get('livraison');
const avecParam = params.get('avec'); // 'pro' ou 'client'

let currentUser = null;

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function contientNumero(texte) {
  const nettoye = texte.replace(/[\s.\-()]/g, '');
  return /\d{7,}/.test(nettoye);
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = '../client/connexion.html';
    return;
  }
  currentUser = user;

  if (livraisonId && avecParam) {
    await chargerConversation(livraisonId, avecParam);
  } else {
    await chargerBoiteReception();
  }
}

// Récupère le professionnel (vendeur ou prestataire) + le client liés à une livraison
async function recupererParticipants(livraison) {
  let proUserId = null;
  let proNom = 'Professionnel';
  let clientNom = 'Client';

  if (livraison.boutique_id) {
    const { data: boutique } = await supabase
      .from('boutiques')
      .select('user_id, nom_boutique')
      .eq('id', livraison.boutique_id)
      .single();
    if (boutique) { proUserId = boutique.user_id; proNom = boutique.nom_boutique || proNom; }
  } else if (livraison.demande_id) {
    const { data: demande } = await supabase
      .from('demandes')
      .select('prestataire_id, client_nom')
      .eq('id', livraison.demande_id)
      .single();
    if (demande) {
      if (demande.client_nom) clientNom = demande.client_nom;
      if (demande.prestataire_id) {
        const { data: prestataire } = await supabase
          .from('prestataires')
          .select('user_id, nom')
          .eq('id', demande.prestataire_id)
          .single();
        if (prestataire) { proUserId = prestataire.user_id; proNom = prestataire.nom || proNom; }
      }
    }
  }

  if (livraison.commande_id && clientNom === 'Client') {
    const { data: commande } = await supabase
      .from('commandes')
      .select('client_nom')
      .eq('id', livraison.commande_id)
      .single();
    if (commande && commande.client_nom) clientNom = commande.client_nom;
  }

  return { proUserId, proNom, clientId: livraison.client_id, clientNom };
}

async function chargerConversation(livraisonId, avec) {
  const { data: livraison, error } = await supabase
    .from('livraisons')
    .select('*')
    .eq('id', livraisonId)
    .single();

  if (error || !livraison) {
    document.getElementById('contenu').innerHTML = '<p class="vide">Livraison introuvable.</p>';
    return;
  }

  const { proUserId, proNom, clientId, clientNom } = await recupererParticipants(livraison);

  const interlocuteurId = avec === 'pro' ? proUserId : clientId;
  const interlocuteurNom = avec === 'pro' ? proNom : clientNom;

  if (!interlocuteurId) {
    document.getElementById('contenu').innerHTML = '<p class="vide">Impossible de trouver cet interlocuteur pour cette livraison.</p>';
    return;
  }

  document.getElementById('titre-chat').textContent = interlocuteurNom;
  document.getElementById('sous-titre-chat').textContent = avec === 'pro' ? 'Vendeur / prestataire' : 'Client';
  document.getElementById('nav-bas').style.display = 'none';

  document.getElementById('contenu').innerHTML = `
    <p class="avertissement">🔒 Le partage de numéro de téléphone est interdit pour votre sécurité.</p>
    <div id="messages"></div>
    <p class="envoi-cours" id="envoi-cours" style="display:none;">Envoi en cours...</p>
    <div class="zone-saisie">
      <button class="btn-media" onclick="document.getElementById('fichier-media').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 15l-4.5-4.5a2 2 0 0 0-2.8 0L5 19"/></svg>
      </button>
      <input type="file" id="fichier-media" accept="image/*,video/*" style="display:none;">
      <input type="text" id="champ-message" placeholder="Écrire un message...">
      <button onclick="envoyerMessage()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  `;

  document.getElementById('fichier-media').onchange = () => envoyerMedia(livraisonId, avec, interlocuteurId, proUserId, clientId);

  await afficherMessages(livraisonId, avec);

  supabase
    .channel('livreur-messages-' + livraisonId + '-' + avec)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `livraison_id=eq.${livraisonId}` }, () => {
      afficherMessages(livraisonId, avec);
    })
    .subscribe();

  window.envoyerMessage = () => envoyerMessageInterne(livraisonId, avec, interlocuteurId, proUserId, clientId);
}

async function afficherMessages(livraisonId, avec) {
  const { data: messages } = await supabase
    .from('messages')
    .select('*')
    .eq('livraison_id', livraisonId)
    .eq('avec', avec)
    .order('created_at', { ascending: true });

  const zone = document.getElementById('messages');
  if (!zone) return;

  if (!messages || messages.length === 0) {
    zone.innerHTML = '<p class="vide">Aucun message. Démarrez la conversation !</p>';
    return;
  }

  zone.innerHTML = messages.map(m => {
    const moi = m.expediteur_id === currentUser.id;
    const heureEnvoi = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
    let media = '';
    if (m.media_url && m.media_type === 'image') media = `<img src="${m.media_url}" alt="photo">`;
    else if (m.media_url && m.media_type === 'video') media = `<video src="${m.media_url}" controls></video>`;
    const texte = m.contenu ? escapeHTML(m.contenu) : '';

    let pied = `Envoyé à ${heureEnvoi}`;
    if (moi && m.lu && m.lu_le) {
      const heureLecture = new Date(m.lu_le).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
      pied += ` · Lu à ${heureLecture}`;
    }

    return `<div class="bulle ${moi ? 'moi' : 'autre'}">${media}${texte}<span class="heure">${pied}</span></div>`;
  }).join('');

  window.scrollTo(0, document.body.scrollHeight);

  const idsNonLus = messages.filter(m => m.expediteur_id !== currentUser.id && !m.lu).map(m => m.id);
  if (idsNonLus.length > 0) {
    await supabase.from('messages').update({ lu: true, lu_le: new Date().toISOString() }).in('id', idsNonLus);
  }
}

async function envoyerMessageInterne(livraisonId, avec, interlocuteurId, proUserId, clientId) {
  const champ = document.getElementById('champ-message');
  const texte = champ.value.trim();
  if (!texte) return;

  if (contientNumero(texte)) {
    alert('⚠️ Le partage de numéro de téléphone n\'est pas autorisé sur WariKo.');
    return;
  }

  const ligne = {
    livraison_id: livraisonId,
    livreur_id: currentUser.id,
    avec: avec,
    expediteur_id: currentUser.id,
    contenu: texte,
    vendeur_id: avec === 'pro' ? proUserId : null,
    client_id: avec === 'client' ? clientId : null
  };

  const { error } = await supabase.from('messages').insert(ligne);
  if (error) {
    alert('Erreur lors de l\'envoi : ' + error.message);
    return;
  }

  champ.value = '';
  await afficherMessages(livraisonId, avec);
}

async function envoyerMedia(livraisonId, avec, interlocuteurId, proUserId, clientId) {
  const input = document.getElementById('fichier-media');
  const fichier = input.files[0];
  if (!fichier) return;

  const indicateur = document.getElementById('envoi-cours');
  indicateur.style.display = 'block';

  const type = fichier.type.startsWith('video') ? 'video' : 'image';
  const cheminFichier = `${livraisonId}/${avec}/${Date.now()}_${fichier.name}`;

  const { error: uploadError } = await supabase.storage.from('messages-media').upload(cheminFichier, fichier);
  if (uploadError) {
    indicateur.style.display = 'none';
    alert('Erreur d\'envoi du fichier : ' + uploadError.message);
    return;
  }

  const { data: urlData } = supabase.storage.from('messages-media').getPublicUrl(cheminFichier);

  const ligne = {
    livraison_id: livraisonId,
    livreur_id: currentUser.id,
    avec: avec,
    expediteur_id: currentUser.id,
    contenu: '',
    media_url: urlData.publicUrl,
    media_type: type,
    vendeur_id: avec === 'pro' ? proUserId : null,
    client_id: avec === 'client' ? clientId : null
  };

  const { error } = await supabase.from('messages').insert(ligne);
  indicateur.style.display = 'none';
  input.value = '';

  if (error) { alert('Erreur : ' + error.message); return; }
  await afficherMessages(livraisonId, avec);
}

async function chargerBoiteReception() {
  const { data: messages } = await supabase
    .from('messages')
    .select('*')
    .eq('livreur_id', currentUser.id)
    .order('created_at', { ascending: false });

  const contenu = document.getElementById('contenu');

  if (!messages || messages.length === 0) {
    contenu.innerHTML = '<div class="liste-conv"><p class="vide"><span class="icone-vide">💬</span>Aucune conversation pour le moment.</p></div>';
    return;
  }

  const conversations = {};
  messages.forEach(m => {
    const cle = m.livraison_id + '-' + m.avec;
    if (!conversations[cle]) conversations[cle] = m;
  });

  const groupes = Object.values(conversations);

  const cartes = await Promise.all(groupes.map(async m => {
    const { data: livraison } = await supabase.from('livraisons').select('*').eq('id', m.livraison_id).single();
    if (!livraison) return '';

    const { proNom, clientNom } = await recupererParticipants(livraison);
    const nom = m.avec === 'pro' ? proNom : clientNom;
    const initiale = (nom || '?').charAt(0).toUpperCase();
    const apercu = m.media_url ? (m.media_type === 'video' ? '🎥 Vidéo' : '📷 Photo') : `${(m.contenu || '').substring(0, 40)}${(m.contenu || '').length > 40 ? '...' : ''}`;
    const heure = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });

    return `
      <a class="conv-item" href="messagerie.html?livraison=${m.livraison_id}&avec=${m.avec}">
        <div class="conv-avatar">${initiale}</div>
        <div class="conv-info">
          <h4>${escapeHTML(nom)} <span class="tag-role ${m.avec}">${m.avec === 'pro' ? 'Pro' : 'Client'}</span></h4>
          <p>${escapeHTML(apercu)}</p>
        </div>
        <span class="conv-heure">${heure}</span>
      </a>
    `;
  }));

  contenu.innerHTML = `<div class="liste-conv">${cartes.join('')}</div>`;
}

init();
</script>
</body>
</html>
