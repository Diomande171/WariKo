<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Marketplace</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
            padding-bottom: 90px;
        }

        .header {
            padding: 22px 20px 18px;
            color: var(--blanc);
        }

        .back-link {
            font-size: 13px;
            color: var(--blanc);
            opacity: 0.75;
            text-decoration: none;
        }

        .header h1 {
            margin-top: 14px;
            font-size: 22px;
        }

        .header p {
            margin-top: 6px;
            font-size: 13px;
            opacity: 0.75;
        }

        .become-seller {
            margin-top: 16px;
            display: block;
            background: var(--jaune);
            border-radius: 14px;
            padding: 14px 16px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            color: var(--violet-fonce);
            text-align: center;
        }

        .section {
            padding: 10px 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--blanc);
            margin-bottom: 12px;
        }

        .categories-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 6px;
            scrollbar-width: none;
        }

        .categories-filter::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08);
            color: var(--blanc);
            font-size: 12px;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 20px;
            border: none;
        }

        .filter-chip.active {
            background: var(--jaune);
            color: var(--violet-fonce);
        }

        .boutique-card {
            background: var(--jaune);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            text-decoration: none;
            display: block;
        }

        .boutique-card .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .boutique-card h3 {
            font-size: 15px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .boutique-card .categorie-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--violet-fonce);
            opacity: 0.75;
            margin-top: 4px;
            display: block;
        }

        .boutique-card .badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--violet-fonce);
            color: var(--jaune);
        }

        .boutique-card p.description {
            margin-top: 10px;
            font-size: 13px;
            color: var(--violet-fonce);
            opacity: 0.85;
            line-height: 1.4;
        }

        .empty {
            color: var(--blanc);
            opacity: 0.6;
            text-align: center;
            padding: 50px 20px;
            font-size: 13px;
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="header">
            <a href="accueil.html" class="back-link">← Retour</a>
            <h1>Marketplace</h1>
            <p>Découvre les boutiques et produits disponibles</p>

            <a href="../vendeur/inscription.html" class="become-seller">+ Ouvrir ma boutique</a>
        </header>

        <section class="section">

            <div class="section-title">Boutiques</div>

            <div class="categories-filter" id="filtres">
                <button class="filter-chip active" data-cat="tout">Tout</button>
                <button class="filter-chip" data-cat="telephones">Téléphones</button>
                <button class="filter-chip" data-cat="mode">Mode</button>
                <button class="filter-chip" data-cat="electronique">Électronique</button>
                <button class="filter-chip" data-cat="maison">Maison</button>
                <button class="filter-chip" data-cat="autre">Autre</button>
            </div>

            <div id="liste-boutiques">
                <p class="empty">Chargement...</p>
            </div>

        </section>

    </div>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const container = document.getElementById("liste-boutiques");
        let toutesLesBoutiques = [];

        const categorieLabels = {
            telephones: "Téléphones",
            mode: "Mode",
            electronique: "Électronique",
            maison: "Maison",
            autre: "Autre"
        };

        function afficherBoutiques(liste) {
            if (!liste || liste.length === 0) {
                container.innerHTML = '<p class="empty">Aucune boutique pour le moment</p>';
                return;
            }

            container.innerHTML = liste.map(function (b) {
                return `
                    <a href="boutique.html?id=${b.id}" class="boutique-card">
                        <div class="top-row">
                            <div>
                                <h3>${b.nom_boutique}</h3>
                                <span class="categorie-tag">${categorieLabels[b.categorie] || b.categorie || ""}</span>
                            </div>
                            <span class="badge">Ouverte</span>
                        </div>
                        <p class="description">${b.description || ""}</p>
                    </a>
                `;
            }).join("");
        }

        async function chargerBoutiques() {
            const { data, error } = await supabaseClient
                .from("boutiques_publiques")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                container.innerHTML = '<p class="empty">Erreur : ' + error.message + '</p>';
                return;
            }

            toutesLesBoutiques = data || [];
            afficherBoutiques(toutesLesBoutiques);
        }

        document.getElementById("filtres").addEventListener("click", function (e) {
            const btn = e.target.closest(".filter-chip");
            if (!btn) return;

            document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
            btn.classList.add("active");

            const cat = btn.dataset.cat;
            if (cat === "tout") {
                afficherBoutiques(toutesLesBoutiques);
            } else {
                afficherBoutiques(toutesLesBoutiques.filter(b => b.categorie === cat));
            }
        });

        chargerBoutiques();
    </script>

</body>

</html>
