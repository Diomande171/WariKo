<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Connexion</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

    <main class="auth-page">

        <div class="auth-logo">
            WariKo
        </div>


        <h1>
            Connexion
        </h1>


        <p>
            Connectez-vous à votre compte WariKo.
        </p>


        <form>

            <label>
                Téléphone ou e-mail
            </label>

            <input
                type="text"
                placeholder="Téléphone ou e-mail"
            >


            <label>
                Mot de passe
            </label>

            <input
                type="password"
                placeholder="Votre mot de passe"
            >


            <button
                type="submit"
                class="primary-button"
            >
                Se connecter
            </button>

        </form>


        <p>
            Vous n'avez pas encore de compte ?
        </p>


        <a href="inscription.html">
            Créer un compte
        </a>

    </main>

</body>

</html>
