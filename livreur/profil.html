<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil livreur - WariKo</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="../assets/IMG_9862.png">

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:0 0 90px; }

  .top-bar { display:flex; align-items:center; gap:12px; padding:16px 20px 10px; }
  .top-bar a { color:var(--blanc); text-decoration:none; font-size:20px; }
  .top-bar h1 { font-family:'Playfair Display',serif; font-size:17px; margin:0; }

  .bandeau-violet { background:var(--violet-fonce); padding:6px 20px 26px; text-align:center; }
  .avatar-wrap { position:relative; width:96px; height:96px; margin:0 auto 12px; }
  .avatar { width:96px; height:96px; border-radius:50%; object-fit:cover; background:rgba(255,255,255,0.1); border:3px solid rgba(255,255,255,0.3); display:block; }
  .avatar-edit { position:absolute; bottom:0; right:0; background:var(--blanc); color:var(--violet-fonce); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid var(--violet-fonce); cursor:pointer; font-size:14px; }
  .avatar-edit input { display:none; }
  .nom-livreur { font-family:'Playfair Display',serif; font-size:19px; font-weight:bold; margin:0 0 8px; }
  .badge-confirme { display:inline-flex; align-items:center; gap:5px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:20px; padding:5px 14px; font-size:12px; font-weight:600; margin-bottom:8px; }
  .note-ligne { font-size:14px; font-weight:700; }
  .note-ligne .etoile { color:var(--jaune); }

  .fiche { background:var(--blanc); color:#222; border-radius:22px 22px 0 0; padding:24px 20px 20px; margin-top:-14px; }
  .section-titre { font-size:13px; font-weight:700; color:var(--violet-fonce); margin:0 0 12px; }
  .section-titre.espace { margin-top:22px; }

  .ligne-info { display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid #eee; font-size:13px; }
  .ligne-info:last-child { border-bottom:none; }
  .ligne-info .gauche { display:flex; align-items:center; gap:8px; color:#777; }
  .ligne-info .droite { font-weight:600; color:#222; text-align:right; }

  .btn { width:100%; border:none; border-radius:30px; padding:14px; font-size:14px; font-weight:bold; font-family:inherit; margin-top:22px; cursor:pointer; }
  .btn-violet { background:var(--violet-fonce); color:var(--blanc); }
  .btn-jaune { background:var(--jaune); color:var(--violet-fonce); }
  .btn-danger { background:transparent; border:2px solid #ff5c5c; color:#ff5c5c; margin-top:10px; }

  .zone-edition { display:none; }
  .zone-edition.visible { display:block; }
  .zone-lecture.cachee { display:none; }

  .champ { margin-bottom:14px; }
  .champ label { display:block; font-size:12px; color:#777; margin-bottom:6px; }
  .champ input, .champ select { width:100%; box-sizing:border-box; background:#f5f5f7; border:1px solid #ddd; border-radius:10px; padding:11px 12px; color:#222; font-family:inherit; font-size:13.5px; }

  .msg-confirmation { text-align:center; font-size:12.5px; color:#1a9e4c; margin-top:8px; display:none; }
  .erreur-globale { padding:30px 20px; text-align:center; color:var(--blanc); font-size:13px; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">←</a>
  <h1>Mon profil</h1>
</div>

<div id="contenu"><p style="text-align:center; padding:40px 20px; opacity:0.7;">Chargement...</p></div>

<div class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M9 18h4.5l1.5-4h3l2 3"/><path d="M4 14l3-6h4l2 3h2.5"/><path d="M13 8h2.5l1.5 3"/></svg>
    Livraisons
  </a>
  <a href="portefeuille.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="profil.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

const BUCKET_AVATARS = 'avatars';
let currentUser = null;
let monLivreur = null;

function pasEncoreDisponible(e) {
  if (e) e.preventDefault();
  alert('🚧 Cette fonctionnalité n\'est pas encore disponible.');
}

function afficherErreur(message) {
  document.getElementById('contenu').innerHTML = `
    <div class="erreur-globale">
      ⚠️ Impossible de charger le profil.<br>
      <span style="opacity:0.6; font-size:11px;">${message}</span>
    </div>
  `;
}

async function init() {
  try {
    const { data: { user }, error: erreurUser } = await supabase.auth.getUser();
    if (erreurUser) { afficherErreur(erreurUser.message); return; }
    if (!user) {
      window.location.href = '../client/connexion.html';
      return;
    }
    currentUser = user;

    // Sécurité : select filtré par user_id ; RLS empêche de toute façon
    // de récupérer la ligne d'un autre livreur.
    const { data: livreur, error: erreurLivreur } = await supabase
      .from('livreurs')
      .select('*')
      .eq('user_id', user.id)
      .single();

    if (erreurLivreur) { afficherErreur(erreurLivreur.message); return; }
    if (!livreur) {
      window.location.href = 'inscription.html';
      return;
    }
    if (livreur.statut !== 'approuve') {
      window.location.href = 'inscription.html';
      return;
    }

    monLivreur = livreur;
    await afficherProfil();
  } catch (e) {
    afficherErreur(e.message || 'Erreur inconnue');
  }
}

async function afficherProfil() {
  const contenu = document.getElementById('contenu');

  const { data: avis } = await supabase
    .from('avis_livreurs')
    .select('note')
    .eq('livreur_id', monLivreur.id);

  const noteMoyenne = avis && avis.length > 0
    ? (avis.reduce((s, a) => s + a.note, 0) / avis.length).toFixed(1)
    : '—';
  const nbAvis = avis ? avis.length : 0;

  const avatarUrl = currentUser.user_metadata?.avatar_url || '';

  const optionsTransport = ['Moto', 'Vélo', 'Voiture', 'Tricycle', 'À pied'];
  const optionsHtml = optionsTransport.map(o =>
    `<option value="${o}" ${monLivreur.moyen_transport === o ? 'selected' : ''}>${o}</option>`
  ).join('');

  contenu.innerHTML = `
    <div class="bandeau-violet">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar-img" src="${avatarUrl}" onerror="this.style.opacity=0">
        <label class="avatar-edit">
          📷
          <input type="file" accept="image/*" id="input-avatar">
        </label>
      </div>
      <div class="nom-livreur">${monLivreur.nom_complet || 'Livreur'}</div>
      <div class="badge-confirme">🛡️ Livreur confirmé</div>
      <div class="note-ligne"><span class="etoile">★</span> ${noteMoyenne} (${nbAvis} avis)</div>
    </div>

    <div class="fiche">

      <div class="zone-lecture" id="zone-lecture">
        <div class="section-titre">Informations personnelles</div>
        <div class="ligne-info">
          <span class="gauche">👤 Nom</span>
          <span class="droite">${monLivreur.nom_complet || '—'}</span>
        </div>
        <div class="ligne-info">
          <span class="gauche">📞 Téléphone</span>
          <span class="droite">${monLivreur.telephone || '—'}</span>
        </div>
        <div class="ligne-info">
          <span class="gauche">✉️ Email</span>
          <span class="droite">${currentUser.email || '—'}</span>
        </div>

        <div class="section-titre espace">Informations de livraison</div>
        <div class="ligne-info">
          <span class="gauche">🛵 Véhicule</span>
          <span class="droite">${monLivreur.moyen_transport || '—'}</span>
        </div>
        <div class="ligne-info">
          <span class="gauche">📍 Zone d'activité</span>
          <span class="droite">${monLivreur.zone_couverture || '—'}</span>
        </div>

        <button class="btn btn-violet" id="btn-ouvrir-edition">Modifier mon profil</button>
        <button class="btn btn-danger" id="btn-deconnexion">Déconnexion</button>
      </div>

      <div class="zone-edition" id="zone-edition">
        <div class="section-titre">Modifier mes informations</div>
        <form id="form-profil">
          <div class="champ">
            <label>Nom complet</label>
            <input type="text" id="champ-nom" value="${monLivreur.nom_complet || ''}" required>
          </div>
          <div class="champ">
            <label>Téléphone</label>
            <input type="tel" id="champ-telephone" value="${monLivreur.telephone || ''}" required>
          </div>
          <div class="champ">
            <label>Zone de couverture</label>
            <input type="text" id="champ-zone" value="${monLivreur.zone_couverture || ''}" required>
          </div>
          <div class="champ">
            <label>Véhicule</label>
            <select id="champ-transport">${optionsHtml}</select>
          </div>
          <button type="submit" class="btn btn-jaune">Enregistrer</button>
          <div class="msg-confirmation" id="msg-confirmation">✅ Profil mis à jour</div>
        </form>
        <button class="btn btn-violet" id="btn-annuler-edition" style="background:transparent; border:2px solid var(--violet-fonce); color:var(--violet-fonce);">Annuler</button>
      </div>

    </div>
  `;

  document.getElementById('btn-ouvrir-edition').addEventListener('click', () => {
    document.getElementById('zone-lecture').classList.add('cachee');
    document.getElementById('zone-edition').classList.add('visible');
  });
  document.getElementById('btn-annuler-edition').addEventListener('click', () => {
    document.getElementById('zone-edition').classList.remove('visible');
    document.getElementById('zone-lecture').classList.remove('cachee');
  });
  document.getElementById('form-profil').addEventListener('submit', enregistrerProfil);
  document.getElementById('input-avatar').addEventListener('change', changerAvatar);
  document.getElementById('btn-deconnexion').addEventListener('click', async () => {
    await supabase.auth.signOut();
    window.location.href = '../client/connexion.html';
  });
}

async function enregistrerProfil(e) {
  e.preventDefault();

  const nom = document.getElementById('champ-nom').value.trim();
  const telephone = document.getElementById('champ-telephone').value.trim();
  const zone = document.getElementById('champ-zone').value.trim();
  const transport = document.getElementById('champ-transport').value;

  // Sécurité : whitelist stricte des colonnes envoyées — jamais statut,
  // photo1_url, photo2_url ou user_id. Le trigger proteger_statut_livreur()
  // bloque de toute façon tout changement de statut côté base.
  const { error } = await supabase
    .from('livreurs')
    .update({
      nom_complet: nom,
      telephone: telephone,
      zone_couverture: zone,
      moyen_transport: transport
    })
    .eq('user_id', currentUser.id); // jamais .eq('id', ...) avec une valeur venant du client

  if (error) {
    alert('Erreur : ' + error.message);
    return;
  }

  monLivreur.nom_complet = nom;
  monLivreur.telephone = telephone;
  monLivreur.zone_couverture = zone;
  monLivreur.moyen_transport = transport;

  await afficherProfil();
  document.getElementById('msg-confirmation').style.display = 'block';
}

async function changerAvatar(e) {
  const fichier = e.target.files[0];
  if (!fichier) return;

  const extension = fichier.name.split('.').pop();
  const chemin = `${currentUser.id}/avatar_${Date.now()}.${extension}`;

  const { error: erreurUpload } = await supabase.storage
    .from(BUCKET_AVATARS)
    .upload(chemin, fichier, { upsert: true });

  if (erreurUpload) {
    alert('Erreur upload : ' + erreurUpload.message);
    return;
  }

  const { data: urlData } = supabase.storage.from(BUCKET_AVATARS).getPublicUrl(chemin);

  const { error: erreurUser } = await supabase.auth.updateUser({
    data: { avatar_url: urlData.publicUrl }
  });

  if (erreurUser) {
    alert('Erreur : ' + erreurUser.message);
    return;
  }

  document.getElementById('avatar-img').src = urlData.publicUrl;
  document.getElementById('avatar-img').style.opacity = 1;
}

init();
</script>
</body>
</html>
