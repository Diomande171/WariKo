<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historique des livraisons - WariKo</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="../assets/IMG_9862.png">

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:16px 16px 90px; }

  .top-bar { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .top-bar a { color:var(--blanc); text-decoration:none; font-size:20px; }
  .top-bar h1 { font-family:'Playfair Display',serif; font-size:17px; margin:0; }
  .sous-titre { font-size:12.5px; opacity:0.7; margin:0 0 16px; }

  .filtres { display:flex; gap:8px; margin-bottom:16px; }
  .filtre-btn { flex:1; text-align:center; padding:9px; border-radius:10px; background:rgba(255,255,255,0.06); font-size:12px; font-weight:700; color:var(--blanc); opacity:0.7; cursor:pointer; }
  .filtre-btn.actif { background:var(--jaune); color:var(--violet-fonce); opacity:1; }

  .resume-mois { display:flex; justify-content:space-between; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:14px 16px; margin-bottom:18px; }
  .resume-item { text-align:center; flex:1; }
  .resume-item .valeur { font-size:16px; font-weight:bold; color:var(--jaune); }
  .resume-item .titre { font-size:10.5px; opacity:0.75; margin-top:2px; }

  .groupe-date { font-size:12px; opacity:0.6; margin:16px 0 8px; text-transform:uppercase; letter-spacing:0.5px; }

  .carte-livraison { background:rgba(255,255,255,0.06); border-radius:14px; padding:13px 14px; margin-bottom:10px; }
  .carte-haut { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .carte-titre { font-size:13.5px; font-weight:700; }
  .carte-montant { font-size:14px; font-weight:800; color:var(--jaune); white-space:nowrap; }
  .carte-details { font-size:11.5px; opacity:0.7; line-height:1.5; }
  .badge-type { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; background:rgba(255,209,0,0.15); color:var(--jaune); margin-bottom:5px; }

  .empty { text-align:center; opacity:0.6; padding:50px 20px; font-size:13px; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">←</a>
  <h1>Historique des livraisons</h1>
</div>
<p class="sous-titre">Toutes tes courses terminées</p>

<div class="filtres">
  <div class="filtre-btn actif" data-periode="mois">Ce mois-ci</div>
  <div class="filtre-btn" data-periode="tout">Tout l'historique</div>
</div>

<div class="resume-mois" id="resume-mois"></div>

<div id="liste-historique"><p class="empty">Chargement...</p></div>

<div class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M9 18h4.5l1.5-4h3l2 3"/><path d="M4 14l3-6h4l2 3h2.5"/><path d="M13 8h2.5l1.5 3"/></svg>
    Livraisons
  </a>
  <a href="#" onclick="pasEncoreDisponible(event)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="profil.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;
let monLivreur = null;
let periodeActive = 'mois';

function pasEncoreDisponible(e) {
  if (e) e.preventDefault();
  alert('🚧 Cette fonctionnalité n\'est pas encore disponible.');
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = '../client/connexion.html';
    return;
  }
  currentUser = user;

  // Sécurité : select filtré par user_id — RLS "livreur_lit_sa_propre_ligne"
  // empêche de toute façon de lire la ligne d'un autre livreur.
  const { data: livreur } = await supabase
    .from('livreurs')
    .select('*')
    .eq('user_id', user.id)
    .single();

  if (!livreur) {
    window.location.href = 'inscription.html';
    return;
  }
  if (livreur.statut !== 'approuve') {
    window.location.href = 'inscription.html';
    return;
  }

  monLivreur = livreur;
  await chargerHistorique();

  document.querySelectorAll('.filtre-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtre-btn').forEach(b => b.classList.remove('actif'));
      btn.classList.add('actif');
      periodeActive = btn.dataset.periode;
      chargerHistorique();
    });
  });
}

function debutMois() {
  const d = new Date();
  d.setDate(1);
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

function montantLivraison(l) {
  if (l.prix_livraison) return l.prix_livraison;
  if (l.distance_km) return Math.round(l.distance_km * 300);
  return 0;
}

function formaterDateGroupe(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

async function chargerHistorique() {
  const listeEl = document.getElementById('liste-historique');
  listeEl.innerHTML = '<p class="empty">Chargement...</p>';

  // Sécurité : filtré par .eq('livreur_id', monLivreur.id) — même sans la
  // policy RLS, ce livreur ne peut voir que ses propres courses terminées.
  let requete = supabase
    .from('livraisons')
    .select('*')
    .eq('livreur_id', monLivreur.id)
    .eq('statut', 'livree')
    .order('created_at', { ascending: false });

  if (periodeActive === 'mois') {
    requete = requete.gte('created_at', debutMois());
  }

  const { data, error } = await requete;

  if (error) {
    listeEl.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
    return;
  }

  const total = data ? data.reduce((s, l) => s + montantLivraison(l), 0) : 0;
  document.getElementById('resume-mois').innerHTML = `
    <div class="resume-item">
      <div class="valeur">${data ? data.length : 0}</div>
      <div class="titre">livraisons</div>
    </div>
    <div class="resume-item">
      <div class="valeur">${total.toLocaleString('fr-FR')} F</div>
      <div class="titre">total gagné</div>
    </div>
  `;

  if (!data || data.length === 0) {
    listeEl.innerHTML = '<p class="empty">Aucune livraison terminée sur cette période</p>';
    return;
  }

  // Regroupement par jour
  const groupes = {};
  data.forEach(l => {
    const cle = formaterDateGroupe(l.created_at);
    if (!groupes[cle]) groupes[cle] = [];
    groupes[cle].push(l);
  });

  let html = '';
  for (const [dateLabel, livraisons] of Object.entries(groupes)) {
    html += `<div class="groupe-date">${dateLabel}</div>`;
    livraisons.forEach(l => {
      const type = l.demande_id ? 'Prestation' : 'Commande';
      const heure = new Date(l.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      html += `
        <div class="carte-livraison">
          <span class="badge-type">${type}</span>
          <div class="carte-haut">
            <div class="carte-titre">${l.adresse_client || 'Livraison'}</div>
            <div class="carte-montant">+${montantLivraison(l).toLocaleString('fr-FR')} F</div>
          </div>
          <div class="carte-details">
            ${heure} · ${l.distance_km ? l.distance_km + ' km' : ''}
          </div>
        </div>
      `;
    });
  }
  listeEl.innerHTML = html;
}

init();
</script>
</body>
</html>
