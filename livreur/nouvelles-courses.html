<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouvelles courses - WariKo</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="../assets/IMG_9862.png">

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing:border-box; }
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:0 16px 90px; }

  .en-tete { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:16px 0 14px; background:linear-gradient(180deg, var(--violet-fonce) 80%, rgba(61,3,122,0)); }
  .btn-retour { width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; color:var(--blanc); text-decoration:none; font-size:17px; flex-shrink:0; }
  .en-tete h1 { font-family:'Playfair Display',serif; font-size:19px; color:var(--jaune); margin:0; letter-spacing:0.2px; }

  .onglets { display:flex; background:rgba(255,255,255,0.06); border-radius:22px; padding:4px; margin-bottom:18px; position:relative; }
  .onglet { flex:1; text-align:center; padding:10px 6px; border-radius:18px; font-size:12.5px; font-weight:600; cursor:pointer; color:rgba(255,255,255,0.6); transition:background .2s ease, color .2s ease; z-index:1; }
  .onglet.actif { background:var(--jaune); color:var(--violet-fonce); box-shadow:0 2px 10px rgba(255,209,0,0.25); }

  .carte-course { background:rgba(255,255,255,0.055); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:14px 14px 12px; margin-bottom:12px; box-shadow:0 4px 14px rgba(0,0,0,0.18); transition:transform .12s ease; }
  .carte-course:active { transform:scale(0.985); }

  .course-haut { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .course-numero { font-size:12px; font-weight:700; color:var(--jaune); letter-spacing:0.3px; }
  .course-heure { font-size:11px; opacity:0.55; }

  .course-corps { display:flex; gap:10px; margin-bottom:10px; }
  .icone-boutique { width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,0.09); display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
  .course-details { flex:1; min-width:0; }
  .course-boutique-nom { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:600; margin-bottom:4px; }
  .badge-type { font-size:9.5px; font-weight:600; padding:2px 7px; border-radius:7px; white-space:nowrap; }
  .badge-type.produit { background:rgba(139,195,74,0.18); color:#a9e069; }
  .badge-type.prestation { background:rgba(100,181,246,0.18); color:#8fc8f5; }
  .course-ligne { display:flex; align-items:center; gap:6px; font-size:12px; opacity:0.75; margin:3px 0; line-height:1.35; }
  .course-ligne .puce { flex-shrink:0; opacity:0.9; }

  .separateur { height:1px; background:rgba(255,255,255,0.07); margin:10px 0; }

  .course-bas { display:flex; justify-content:space-between; align-items:center; }
  .course-prix-bloc { display:flex; flex-direction:column; }
  .course-prix-label { font-size:10px; opacity:0.5; margin-bottom:1px; }
  .course-prix { font-size:17px; font-weight:700; color:var(--jaune); }

  .btn-accepter { background:var(--jaune); color:var(--violet-fonce); border:none; border-radius:10px; padding:10px 20px; font-size:12.5px; font-weight:700; box-shadow:0 3px 10px rgba(255,209,0,0.2); }
  .btn-accepter:active { transform:scale(0.96); }

  .badge { display:inline-block; font-size:10.5px; font-weight:600; padding:3px 9px; border-radius:8px; margin-bottom:8px; }
  .badge.acceptee { background:rgba(76,175,80,0.18); color:#8fd98f; }
  .badge.encours { background:rgba(33,150,243,0.18); color:#8fc8f5; }

  .actions { display:flex; gap:8px; margin-top:2px; }
  .actions button, .actions a { flex:1; padding:10px; border-radius:10px; border:none; font-size:12px; font-weight:600; text-align:center; text-decoration:none; }
  .btn-progresser { background:rgba(255,255,255,0.12); color:var(--blanc); }
  .btn-progresser:active { background:rgba(255,255,255,0.18); }
  .btn-contacter { background:rgba(255,209,0,0.08); color:var(--jaune); border:1px solid rgba(255,209,0,0.4); }

  .vide { text-align:center; opacity:0.55; font-size:13px; padding:50px 20px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .vide .icone-vide { font-size:34px; opacity:0.5; }

  .squelette { background:rgba(255,255,255,0.05); border-radius:16px; padding:14px; margin-bottom:12px; }
  .squelette-ligne { height:11px; border-radius:6px; background:rgba(255,255,255,0.08); margin-bottom:8px; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:0.5;} 50%{opacity:1;} }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div class="en-tete">
  <a class="btn-retour" href="index.html">←</a>
  <h1>Nouvelles courses</h1>
</div>

<div class="onglets">
  <div class="onglet" id="onglet-attente" onclick="changerOnglet('attente')">À accepter</div>
  <div class="onglet" id="onglet-encours" onclick="changerOnglet('encours')">En cours</div>
</div>

<div id="contenu">
  <div class="squelette"><div class="squelette-ligne" style="width:40%"></div><div class="squelette-ligne" style="width:70%"></div><div class="squelette-ligne" style="width:50%"></div></div>
  <div class="squelette"><div class="squelette-ligne" style="width:40%"></div><div class="squelette-ligne" style="width:70%"></div><div class="squelette-ligne" style="width:50%"></div></div>
</div>

<input type="file" id="fichier-preuve" accept="image/*" capture="environment" style="display:none;">

<div class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M9 18h4.5l1.5-4h3l2 3"/><path d="M4 14l3-6h4l2 3h2.5"/><path d="M13 8h2.5l1.5 3"/></svg>
    Livraisons
  </a>
  <a href="portefeuille.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="profil.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let monLivreur = null;
let ongletActif = 'attente';
let intervalleRafraichissement = null;

function pasEncoreDisponible(e) {
  if (e) e.preventDefault();
  alert('🚧 Cette fonctionnalité n\'est pas encore disponible.');
}

function numeroCourse(l) {
  return 'LIV-' + l.id.replace(/-/g, '').slice(-4).toUpperCase();
}

function heureCourse(l) {
  const d = new Date(l.created_at);
  const auj = new Date();
  const estAujourdhui = d.toDateString() === auj.toDateString();
  const heure = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  return (estAujourdhui ? "Aujourd'hui" : d.toLocaleDateString('fr-FR')) + ' · ' + heure;
}

function montantLivraison(l) {
  if (l.prix_livraison) return l.prix_livraison;
  if (l.distance_km) return Math.round(l.distance_km * 300);
  return 0;
}

function typeLivraison(l) {
  if (l.type === 'demande') return 'prestation';
  if (l.type === 'commande') return 'produit';
  return l.demande_id ? 'prestation' : 'produit';
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = '../client/connexion.html';
    return;
  }

  const { data: livreur } = await supabase
    .from('livreurs')
    .select('*')
    .eq('user_id', user.id)
    .single();

  if (!livreur) {
    window.location.href = 'inscription.html';
    return;
  }

  if (livreur.statut !== 'approuve') {
    window.location.href = 'inscription.html';
    return;
  }

  monLivreur = livreur;

  const params = new URLSearchParams(window.location.search);
  if (params.get('onglet') === 'en_cours') ongletActif = 'encours';

  afficherOnglets();
  await charger();

  // Rafraîchissement discret des nouvelles courses en attente (toutes les 20s)
  intervalleRafraichissement = setInterval(() => {
    if (ongletActif === 'attente' && document.visibilityState === 'visible') {
      charger(true);
    } else {
      chargerCompteurs();
    }
  }, 20000);
}

async function changerOnglet(nom) {
  ongletActif = nom;
  afficherOnglets();
  await charger();
}

function afficherOnglets() {
  document.getElementById('onglet-attente').classList.toggle('actif', ongletActif === 'attente');
  document.getElementById('onglet-encours').classList.toggle('actif', ongletActif === 'encours');
}

async function chargerCompteurs() {
  const { count: nbAttente } = await supabase
    .from('livraisons')
    .select('*', { count: 'exact', head: true })
    .eq('statut', 'en_attente');

  const { count: nbEnCours } = await supabase
    .from('livraisons')
    .select('*', { count: 'exact', head: true })
    .eq('livreur_id', monLivreur.id)
    .in('statut', ['acceptee', 'en_cours']);

  document.getElementById('onglet-attente').textContent = `À accepter (${nbAttente || 0})`;
  document.getElementById('onglet-encours').textContent = `En cours (${nbEnCours || 0})`;
}

async function charger(silencieux) {
  const contenu = document.getElementById('contenu');
  if (!silencieux) {
    contenu.innerHTML = `
      <div class="squelette"><div class="squelette-ligne" style="width:40%"></div><div class="squelette-ligne" style="width:70%"></div><div class="squelette-ligne" style="width:50%"></div></div>
      <div class="squelette"><div class="squelette-ligne" style="width:40%"></div><div class="squelette-ligne" style="width:70%"></div><div class="squelette-ligne" style="width:50%"></div></div>
    `;
  }

  await chargerCompteurs();

  if (ongletActif === 'attente') {
    const { data: courses } = await supabase
      .from('livraisons')
      .select('*, boutiques(nom_boutique)')
      .eq('statut', 'en_attente')
      .order('created_at', { ascending: true });

    const listeArticles = await compterArticles(courses);

    contenu.innerHTML = courses && courses.length > 0
      ? courses.map(l => carteAttente(l, listeArticles[l.commande_id])).join('')
      : '<div class="vide"><span class="icone-vide">📭</span>Aucune course en attente pour le moment.</div>';
  } else {
    const { data: courses } = await supabase
      .from('livraisons')
      .select('*, boutiques(nom_boutique)')
      .eq('livreur_id', monLivreur.id)
      .in('statut', ['acceptee', 'en_cours'])
      .order('created_at', { ascending: true });

    const listeArticles = await compterArticles(courses);

    contenu.innerHTML = courses && courses.length > 0
      ? courses.map(l => carteEnCours(l, listeArticles[l.commande_id])).join('')
      : '<div class="vide"><span class="icone-vide">🛵</span>Aucune livraison en cours.</div>';
  }
}

async function compterArticles(courses) {
  const idsCommandes = (courses || []).map(l => l.commande_id).filter(Boolean);
  if (idsCommandes.length === 0) return {};

  const { data: lignes } = await supabase
    .from('commande_produits')
    .select('commande_id')
    .in('commande_id', idsCommandes);

  const compte = {};
  (lignes || []).forEach(l => {
    compte[l.commande_id] = (compte[l.commande_id] || 0) + 1;
  });
  return compte;
}

function carteAttente(l, nbArticles) {
  const distance = l.distance_km ? `${l.distance_km.toFixed(1)} km` : '';
  const articles = nbArticles ? `${nbArticles} article${nbArticles > 1 ? 's' : ''}${distance ? ' · ' : ''}` : '';
  const type = typeLivraison(l);
  const iconeType = type === 'prestation' ? '🛠️' : '🏪';

  return `
    <div class="carte-course">
      <div class="course-haut">
        <span class="course-numero">#${numeroCourse(l)}</span>
        <span class="course-heure">${heureCourse(l)}</span>
      </div>
      <div class="course-corps">
        <div class="icone-boutique">${iconeType}</div>
        <div class="course-details">
          <div class="course-boutique-nom">
            ${l.boutiques ? l.boutiques.nom_boutique : 'Boutique'}
            <span class="badge-type ${type}">${type === 'prestation' ? 'Prestation' : 'Produit'}</span>
          </div>
          <div class="course-ligne"><span class="puce">📦</span>${articles}${distance}</div>
          <div class="course-ligne"><span class="puce">📍</span>${l.adresse_client || 'Adresse non précisée'}</div>
        </div>
      </div>
      <div class="separateur"></div>
      <div class="course-bas">
        <div class="course-prix-bloc">
          <span class="course-prix-label">Vous gagnez</span>
          <span class="course-prix">${montantLivraison(l).toLocaleString('fr-FR')} F</span>
        </div>
        <button class="btn-accepter" onclick="accepterLivraison('${l.id}')">Accepter</button>
      </div>
    </div>
  `;
}

function carteEnCours(l, nbArticles) {
  const distance = l.distance_km ? `${l.distance_km.toFixed(1)} km` : '';
  const articles = nbArticles ? `${nbArticles} article${nbArticles > 1 ? 's' : ''}${distance ? ' · ' : ''}` : '';
  const type = typeLivraison(l);
  const iconeType = type === 'prestation' ? '🛠️' : '🏪';
  const badgeClasse = l.statut === 'acceptee' ? 'acceptee' : 'encours';
  const badgeTexte = l.statut === 'acceptee' ? 'Acceptée' : 'En cours';

  let boutonAction = '';
  if (l.statut === 'acceptee') {
    boutonAction = `<button class="btn-progresser" onclick="changerStatut('${l.id}','en_cours')">Démarrer la livraison</button>`;
  } else {
    boutonAction = `<button class="btn-progresser" onclick="demarrerPhotoLivraison('${l.id}')">📷 Confirmer avec photo</button>`;
  }

  return `
    <div class="carte-course">
      <div class="course-haut">
        <span class="course-numero">#${numeroCourse(l)}</span>
        <span class="course-heure">${heureCourse(l)}</span>
      </div>
      <div class="course-corps">
        <div class="icone-boutique">${iconeType}</div>
        <div class="course-details">
          <div class="course-boutique-nom">
            ${l.boutiques ? l.boutiques.nom_boutique : 'Boutique'}
            <span class="badge-type ${type}">${type === 'prestation' ? 'Prestation' : 'Produit'}</span>
          </div>
          <div class="course-ligne"><span class="puce">📦</span>${articles}${distance}</div>
          <div class="course-ligne"><span class="puce">📍</span>${l.adresse_client || 'Adresse non précisée'}</div>
        </div>
      </div>
      <div class="separateur"></div>
      <span class="badge ${badgeClasse}">${badgeTexte}</span>
      <div class="actions">
        ${boutonAction}
        <a class="btn-contacter" href="../client/messagerie.html?livraison=${l.id}&client=${l.client_id}">Contacter</a>
      </div>
    </div>
  `;
}

async function accepterLivraison(livraisonId) {
  const { error } = await supabase
    .from('livraisons')
    .update({ livreur_id: monLivreur.id, statut: 'acceptee' })
    .eq('id', livraisonId)
    .eq('statut', 'en_attente');

  if (error) {
    alert('Cette course a peut-être déjà été prise par un autre livreur.');
  }
  await charger();
}

async function changerStatut(livraisonId, nouveauStatut) {
  const { error } = await supabase.from('livraisons').update({ statut: nouveauStatut }).eq('id', livraisonId);
  if (error) {
    alert('Erreur : ' + error.message);
  }
  await charger();
}

function demarrerPhotoLivraison(livraisonId) {
  const input = document.getElementById('fichier-preuve');
  input.onchange = () => confirmerLivraisonAvecPhoto(livraisonId);
  input.click();
}

async function confirmerLivraisonAvecPhoto(livraisonId) {
  const input = document.getElementById('fichier-preuve');
  const fichier = input.files[0];
  if (!fichier) return;

  const cheminFichier = `${livraisonId}/livreur_${Date.now()}.jpg`;

  const { error: uploadError } = await supabase.storage
    .from('livraison-preuves')
    .upload(cheminFichier, fichier);

  if (uploadError) {
    alert("Erreur d'envoi de la photo : " + uploadError.message);
    return;
  }

  const { data: urlData } = supabase.storage.from('livraison-preuves').getPublicUrl(cheminFichier);

  const { error } = await supabase
    .from('livraisons')
    .update({ statut: 'livree', photo_livreur: urlData.publicUrl })
    .eq('id', livraisonId);

  input.value = '';

  if (error) {
    alert('Erreur : ' + error.message);
    return;
  }

  alert('✅ Livraison confirmée avec photo !');
  window.location.href = 'index.html';
}

window.addEventListener('beforeunload', () => {
  if (intervalleRafraichissement) clearInterval(intervalleRafraichissement);
});

init();
</script>
</body>
</html>
