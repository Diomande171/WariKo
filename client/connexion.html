<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Connexion</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background:
                linear-gradient(rgba(30, 2, 60, 0.55), rgba(30, 2, 60, 0.55)),
                url('../assets/8962F136-B7E6-4C8B-97E9-C462192F9E4E.png') center top / cover no-repeat,
                var(--violet-fonce);
            background-attachment: fixed;
        }

        .auth-content {
            background: rgba(20, 1, 45, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 20px;
        }

        .mascotte-scene {
            position: relative;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0 4px;
        }

        .mascotte-img {
            height: 120px;
            width: auto;
            opacity: 0;
            transform: scale(0.85);
            animation: apparition 0.6s ease-out forwards, tourDeMagie 1.8s ease-in-out 0.6s;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }

        @keyframes apparition {
            0%   { opacity: 0; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes tourDeMagie {
            0%   { transform: scale(1) rotate(0deg); }
            15%  { transform: scale(1.02) rotate(-4deg); }
            30%  { transform: scale(1) rotate(3deg); }
            45%  { transform: scale(1.02) rotate(-4deg); }
            60%  { transform: scale(1) rotate(3deg); }
            75%  { transform: scale(1.02) rotate(-2deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .etincelle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--jaune);
            opacity: 0;
            box-shadow: 0 0 6px 2px var(--jaune);
        }

        .etincelle.jouer {
            animation: voleEtincelle 1.4s ease-out forwards;
        }

        .etincelle:nth-child(1) { animation-delay: 0.7s; }
        .etincelle:nth-child(2) { animation-delay: 0.95s; }
        .etincelle:nth-child(3) { animation-delay: 1.2s; }
        .etincelle:nth-child(4) { animation-delay: 1.45s; }
        .etincelle:nth-child(5) { animation-delay: 1.7s; }

        @keyframes voleEtincelle {
            0%   { opacity: 0; transform: translate(-50%, -50%) rotate(0deg) translateX(0) scale(0.4); }
            15%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--angle, 0deg)) translateX(60px) scale(1); }
        }

        .etincelle:nth-child(1) { --angle: 20deg; }
        .etincelle:nth-child(2) { --angle: 90deg; }
        .etincelle:nth-child(3) { --angle: 160deg; }
        .etincelle:nth-child(4) { --angle: 230deg; }
        .etincelle:nth-child(5) { --angle: 300deg; }

        .champs-formulaire {
            opacity: 0;
            transform: translateY(14px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .champs-formulaire.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
    </style>

</head>


<body>

    <main class="auth-page">

        <a
            href="../index.html"
            class="back-button"
        >
            ← Retour
        </a>

        <div class="mascotte-scene">
            <img id="mascotteImg" class="mascotte-img" src="../assets/7C7C2F57-762E-4827-B116-A06B3047B284.png" alt="Mascotte WariKo">
            <span class="etincelle"></span>
            <span class="etincelle"></span>
            <span class="etincelle"></span>
            <span class="etincelle"></span>
            <span class="etincelle"></span>
        </div>


        <section class="auth-content">

            <h1>
                Bienvenue 👋
            </h1>

            <p>
                Connectez-vous à votre compte WariKo.
            </p>


            <form id="login-form">

                <div id="champsFormulaire" class="champs-formulaire">

                    <label for="identifier">
                        E-mail
                    </label>

                    <input
                        id="identifier"
                        type="text"
                        placeholder="Votre e-mail"
                        required
                    >


                    <label for="password">
                        Mot de passe
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="Votre mot de passe"
                        required
                    >


                    <a
                        href="#"
                        class="forgot-password"
                    >
                        Mot de passe oublié ?
                    </a>


                    <p id="error-message" style="color: red; display: none;"></p>


                    <button
                        type="submit"
                        class="primary-button"
                    >
                        Se connecter
                    </button>

                </div>

            </form>


            <div id="basDePage" class="champs-formulaire">

                <div class="auth-divider">
                    <span>OU</span>
                </div>


                <p class="create-text">
                    Vous n'avez pas encore de compte ?
                </p>


                <a
                    href="inscription.html"
                    class="secondary-button"
                >
                    Créer un compte
                </a>

            </div>

        </section>


        <p class="auth-footer">
            WariKo protège vos informations personnelles.
        </p>

    </main>


    <script>
        // Animation d'entrée de la mascotte : quelques tours de magie avec le bâton
        const etincelles = document.querySelectorAll(".etincelle");
        etincelles.forEach(e => e.classList.add("jouer"));

        const champsFormulaire = document.getElementById("champsFormulaire");
        const basDePage = document.getElementById("basDePage");

        setTimeout(() => {
            champsFormulaire.classList.add("visible");
            basDePage.classList.add("visible");
        }, 2400);

        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const ADMIN_UID = "895d437b-aa9b-4c68-9f82-11ed30953687";
        const ADMIN_EMAIL = "admin@wariko.app";

        const form = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const saisie = document.getElementById("identifier").value.trim();
            const password = document.getElementById("password").value;

            // Si l'utilisateur tape "admin", on traduit en email caché côté Supabase
            const estAdmin = saisie.toLowerCase() === "admin";
            const email = estAdmin ? ADMIN_EMAIL : saisie;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMessage.textContent = "Identifiants incorrects. Réessayez.";
                errorMessage.style.display = "block";
                return;
            }

            // Vérification supplémentaire : seul le compte admin va vers le panneau admin
            if (data.user && data.user.id === ADMIN_UID) {
                window.location.href = "../admin/index.html";
            } else {
                window.location.href = "accueil.html";
            }
        });
    </script>

</body>

</html>
