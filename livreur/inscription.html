<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devenir livreur - WariKo</title>
<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:20px 16px 40px; }
  h1 { font-family:'Playfair Display',serif; font-size:22px; color:var(--jaune); margin-bottom:6px; }
  p.sous-titre { font-size:13px; opacity:0.8; margin-bottom:24px; }
  label { display:block; font-size:13px; margin:16px 0 6px; color:var(--jaune); }
  input, select { width:100%; padding:12px 14px; border-radius:10px; border:none; background:rgba(255,255,255,0.08); color:var(--blanc); font-size:14px; box-sizing:border-box; }
  input::placeholder { color:rgba(255,255,255,0.4); }
  .zone-photo { display:flex; gap:10px; margin-top:8px; }
  .case-photo { flex:1; height:100px; border:2px dashed rgba(255,255,255,0.2); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:12px; opacity:0.6; overflow:hidden; position:relative; }
  .case-photo img { width:100%; height:100%; object-fit:cover; }
  button { width:100%; margin-top:28px; padding:14px; border:none; border-radius:12px; background:var(--jaune); color:var(--violet-fonce); font-weight:bold; font-size:15px; }
  .erreur { color:#ff8080; font-size:13px; margin-top:10px; }
</style>
</head>
<body>

<h1>Devenir livreur</h1>
<p class="sous-titre">Inscris-toi pour recevoir des livraisons près de chez toi. 2 photos de toi sont obligatoires — elles seront visibles par les clients pour qu'ils te reconnaissent.</p>

<form id="form-livreur">
  <label>Nom complet</label>
  <input type="text" id="nom_complet" placeholder="Ex: Kouassi Jean" required>

  <label>Téléphone</label>
  <input type="tel" id="telephone" placeholder="Ex: 07 12 34 56 78" required>

  <label>Zone de couverture</label>
  <input type="text" id="zone_couverture" placeholder="Ex: Cocody, Angré" required>

  <label>Moyen de transport</label>
  <select id="moyen_transport" required>
    <option value="">Choisir...</option>
    <option value="moto">Moto</option>
    <option value="voiture">Voiture</option>
    <option value="velo">Vélo</option>
    <option value="a_pied">À pied</option>
  </select>

  <label>2 photos de toi (obligatoire)</label>
  <div class="zone-photo">
    <div class="case-photo" id="apercu1" onclick="document.getElementById('photo1').click()">📷 Photo 1</div>
    <div class="case-photo" id="apercu2" onclick="document.getElementById('photo2').click()">📷 Photo 2</div>
  </div>
  <input type="file" id="photo1" accept="image/*" capture="user" style="display:none;" onchange="apercuPhoto(1)">
  <input type="file" id="photo2" accept="image/*" capture="user" style="display:none;" onchange="apercuPhoto(2)">

  <button type="submit">S'inscrire comme livreur</button>
  <p class="erreur" id="erreur"></p>
</form>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

function apercuPhoto(numero) {
  const input = document.getElementById('photo' + numero);
  const apercu = document.getElementById('apercu' + numero);
  const fichier = input.files[0];
  if (!fichier) return;
  const url = URL.createObjectURL(fichier);
  apercu.innerHTML = `<img src="${url}" alt="photo ${numero}">`;
}

document.getElementById('form-livreur').addEventListener('submit', async (e) => {
  e.preventDefault();
  const erreur = document.getElementById('erreur');
  erreur.textContent = '';

  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { window.location.href = '../client/connexion.html'; return; }

  const photo1 = document.getElementById('photo1').files[0];
  const photo2 = document.getElementById('photo2').files[0];

  if (!photo1 || !photo2) {
    erreur.textContent = 'Les 2 photos sont obligatoires.';
    return;
  }

  const nom_complet = document.getElementById('nom_complet').value.trim();
  const telephone = document.getElementById('telephone').value.trim();
  const zone_couverture = document.getElementById('zone_couverture').value.trim();
  const moyen_transport = document.getElementById('moyen_transport').value;

  const bouton = e.target.querySelector('button');
  bouton.disabled = true;
  bouton.textContent = 'Envoi en cours...';

  const chemin1 = `${user.id}/photo1_${Date.now()}.jpg`;
  const chemin2 = `${user.id}/photo2_${Date.now()}.jpg`;

  const { error: err1 } = await supabase.storage.from('livreurs-photos').upload(chemin1, photo1);
  const { error: err2 } = await supabase.storage.from('livreurs-photos').upload(chemin2, photo2);

  if (err1 || err2) {
    erreur.textContent = "Erreur lors de l'envoi des photos.";
    bouton.disabled = false;
    bouton.textContent = "S'inscrire comme livreur";
    return;
  }

  const url1 = supabase.storage.from('livreurs-photos').getPublicUrl(chemin1).data.publicUrl;
  const url2 = supabase.storage.from('livreurs-photos').getPublicUrl(chemin2).data.publicUrl;

  const { error } = await supabase.from('livreurs').insert({
    user_id: user.id,
    nom_complet,
    telephone,
    zone_couverture,
    moyen_transport,
    statut: 'disponible',
    photo1_url: url1,
    photo2_url: url2
  });

  if (error) {
    erreur.textContent = "Erreur : " + error.message;
    bouton.disabled = false;
    bouton.textContent = "S'inscrire comme livreur";
    return;
  }

  window.location.href = 'index.html';
});
</script>
</body>
</html>
