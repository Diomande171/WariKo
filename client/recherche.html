<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Recherche</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
        }

        .search-header {
            background: var(--violet-fonce);
            color: var(--blanc);
            padding: 22px 20px 26px;
        }

        .search-header .back-button {
            display: block;
            color: var(--blanc);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 14px;
        }

        .search-header h1 {
            font-size: 20px;
        }

        .search-header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .search-box {
            margin-top: 18px;
            background: var(--jaune);
            border-radius: 14px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 14px;
            color: var(--violet-fonce);
            font-weight: 600;
            background: transparent;
        }

        .search-box input::placeholder {
            color: var(--violet-fonce);
            opacity: 0.65;
        }

        .section-title {
            padding: 22px 20px 10px;
            font-size: 15px;
            font-weight: 700;
            color: var(--blanc);
        }

        .categories-scroll {
            display: flex;
            gap: 12px;
            padding: 0 20px 4px;
            overflow-x: auto;
        }

        .category-chip {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 14px 16px;
            border-radius: 16px;
            background: var(--jaune);
            border: 2px solid transparent;
            font-size: 12px;
            color: var(--violet-fonce);
            font-weight: 600;
            min-width: 74px;
            cursor: pointer;
        }

        .category-chip .icon {
            font-size: 22px;
        }

        .category-chip.active {
            background: var(--jaune);
            border-color: var(--blanc);
            color: var(--violet-fonce);
            font-weight: 800;
        }

        .pro-list {
            padding: 6px 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .pro-card {
            display: flex;
            gap: 14px;
            background: var(--jaune);
            border: none;
            border-radius: 16px;
            padding: 14px;
            text-decoration: none;
            color: var(--violet-fonce);
        }

        .pro-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--violet-fonce);
            color: var(--jaune);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }

        .pro-info {
            flex: 1;
            min-width: 0;
        }

        .pro-info .name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .pro-info .pro-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .pro-info .pro-category {
            margin-top: 2px;
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.75;
            font-weight: 600;
        }

        .pro-info .pro-description {
            margin-top: 8px;
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.85;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: var(--blanc);
            opacity: 0.75;
            font-size: 14px;
        }

        .bottom-nav {
            background: var(--violet-fonce);
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="search-header">

            <a href="accueil.html" class="back-button">← Retour</a>

            <h1>Trouver un professionnel</h1>
            <p>Choisis une catégorie et découvre les prestataires disponibles</p>

            <div class="search-box">
                🔍
                <input
                    type="text"
                    id="search-input"
                    placeholder="Rechercher un service ou un nom..."
                >
            </div>

        </header>


        <h2 class="section-title">Catégories</h2>

        <div class="categories-scroll" id="categories-scroll"></div>


        <h2 class="section-title" id="results-title">Professionnels disponibles</h2>

        <div class="pro-list" id="pro-list">
            <p class="empty-state">Chargement...</p>
        </div>


        <nav class="bottom-nav">

            <a href="accueil.html">
                🏠
                <span>Accueil</span>
            </a>

            <a href="recherche.html" class="active">
                🔍
                <span>Recherche</span>
            </a>

            <a href="messagerie.html">
                💬
                <span>Messages</span>
            </a>

            <a href="marketplace.html">
                🛍️
                <span>Marketplace</span>
            </a>

            <a href="commandes.html">
                📦
                <span>Commandes</span>
            </a>

            <a href="profil.html">
                👤
                <span>Profil</span>
            </a>

        </nav>

    </div>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Doit rester synchronisée avec la liste de métiers de prestataire/inscription.html
        const CATEGORIES = [
            { id: "plombier", label: "Plomberie", icon: "🔧" },
            { id: "electricien", label: "Électricité", icon: "💡" },
            { id: "menuisier", label: "Menuiserie", icon: "🪚" },
            { id: "peintre", label: "Peinture", icon: "🎨" },
            { id: "macon", label: "Maçonnerie", icon: "🧱" },
            { id: "mecanicien", label: "Mécanique", icon: "🔩" },
            { id: "coiffeur", label: "Coiffure", icon: "💇" },
            { id: "couturier", label: "Couture", icon: "🧵" },
            { id: "cordonnier", label: "Cordonnerie", icon: "👞" },
            { id: "reparation_informatique", label: "Informatique / Tél.", icon: "💻" },
            { id: "photographe", label: "Photographie", icon: "📷" },
            { id: "traiteur", label: "Traiteur", icon: "🍽️" },
            { id: "menage", label: "Ménage", icon: "🧹" },
            { id: "demenagement", label: "Déménagement", icon: "🚚" },
            { id: "jardinier", label: "Jardinage", icon: "🌿" },
            { id: "climatisation", label: "Climatisation", icon: "❄️" },
            { id: "soudeur", label: "Soudure", icon: "🔥" },
            { id: "vitrier", label: "Vitrerie", icon: "🪟" },
            { id: "autre", label: "Autre", icon: "🛠️" },
        ];

        let TOUS_LES_PRESTATAIRES = [];
        let activeCategory = null;
        let searchTerm = "";

        const categoriesScroll = document.getElementById("categories-scroll");
        const proList = document.getElementById("pro-list");
        const resultsTitle = document.getElementById("results-title");
        const searchInput = document.getElementById("search-input");

        function labelPourMetier(metier) {
            return CATEGORIES.find(c => c.id === metier)?.label || metier;
        }

        function initials(name) {
            if (!name) return "?";
            return name.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase();
        }

        function renderCategories() {
            categoriesScroll.innerHTML = "";

            CATEGORIES.forEach(cat => {
                const chip = document.createElement("div");
                chip.className = "category-chip" + (activeCategory === cat.id ? " active" : "");
                chip.innerHTML = `<span class="icon">${cat.icon}</span><span>${cat.label}</span>`;
                chip.addEventListener("click", () => {
                    activeCategory = (activeCategory === cat.id) ? null : cat.id;
                    renderCategories();
                    renderProList();
                });
                categoriesScroll.appendChild(chip);
            });
        }

        function renderProList() {
            const term = searchTerm.trim().toLowerCase();

            const filtered = TOUS_LES_PRESTATAIRES.filter(pro => {
                const matchCategory = !activeCategory || pro.metier === activeCategory;
                const matchTerm = !term
                    || (pro.nom || "").toLowerCase().includes(term)
                    || (pro.metier || "").toLowerCase().includes(term)
                    || (pro.description || "").toLowerCase().includes(term);
                return matchCategory && matchTerm;
            });

            resultsTitle.textContent = activeCategory
                ? `${labelPourMetier(activeCategory)} près de toi`
                : "Professionnels disponibles";

            proList.innerHTML = "";

            if (filtered.length === 0) {
                proList.innerHTML = `<div class="empty-state">Aucun professionnel trouvé pour cette recherche.</div>`;
                return;
            }

            filtered.forEach(pro => {
                const catLabel = labelPourMetier(pro.metier);

                const card = document.createElement("a");
                card.href = `demande.html?prestataire_id=${encodeURIComponent(pro.user_id)}&nom=${encodeURIComponent(pro.nom || "")}&categorie=${encodeURIComponent(catLabel)}`;
                card.className = "pro-card";
                card.innerHTML = `
                    <div class="pro-avatar">${initials(pro.nom)}</div>
                    <div class="pro-info">
                        <div class="name-row">
                            <span class="pro-name">${pro.nom || "Prestataire"}</span>
                        </div>
                        <div class="pro-category">${catLabel}</div>
                        <div class="pro-description">${pro.description || ""}</div>
                    </div>
                `;
                proList.appendChild(card);
            });
        }

        async function chargerPrestataires() {
            const { data, error } = await supabaseClient
                .from("prestataires_publics")
                .select("*")
                .order("id", { ascending: false });

            if (error) {
                proList.innerHTML = '<p class="empty-state">Erreur : ' + error.message + '</p>';
                return;
            }

            TOUS_LES_PRESTATAIRES = data || [];
            renderProList();
        }

        searchInput.addEventListener("input", (e) => {
            searchTerm = e.target.value;
            renderProList();
        });

        renderCategories();
        chargerPrestataires();
    </script>

</body>

</html>
