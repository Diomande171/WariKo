<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Mon profil</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .profile-header {
            background: var(--violet-fonce);
            color: var(--blanc);
            padding: 22px 20px 34px;
            border-radius: 0 0 30px 30px;
            text-align: center;
        }

        .profile-header .back-button {
            display: block;
            text-align: left;
            color: var(--blanc);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 84px;
            margin: 10px auto 0;
        }

        .avatar {
            width: 84px;
            height: 84px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: var(--jaune);
            color: var(--violet-fonce);

            font-size: 30px;
            font-weight: 800;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-edit {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--violet-fonce);
            border: 2px solid var(--blanc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        .avatar-edit input {
            display: none;
        }

        .profile-header h1 {
            margin-top: 14px;
            font-size: 20px;
        }

        .profile-header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .verif-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .verif-badge.approuve {
            background: rgba(0, 200, 100, 0.2);
            color: #00c864;
        }

        .verif-badge.en_attente {
            background: rgba(255, 209, 0, 0.2);
            color: var(--jaune);
        }

        .verif-badge.refuse {
            background: rgba(255, 60, 60, 0.2);
            color: #ff5c5c;
        }

        .verif-badge.aucune {
            background: rgba(255, 255, 255, 0.12);
            color: var(--blanc);
        }
