<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WariKo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- EN-TÊTE -->
        <header class="header">

            <div class="logo">
                WariKo
            </div>

            <div class="welcome">
                Bienvenue
            </div>

            <div class="title">
                Mon compte
            </div>

        </header>


        <!-- SOLDE -->
        <section class="balance-card">

            <div class="balance-label">
                Solde disponible
            </div>

            <div class="balance">
                250 000
                <span class="currency">FCFA</span>
            </div>

        </section>


        <!-- QR CODE -->
        <section class="qr-container">

            <div class="qr-title">
                Mon QR Code
            </div>

            <div class="qr">
            </div>

        </section>


        <!-- ACTIONS -->
        <section class="actions">

            <div class="action">

                <div class="action-button">
                    ↑
                </div>

                <div class="action-name">
                    Envoyer
                </div>

            </div>


            <div class="action">

                <div class="action-button">
                    ↓
                </div>

                <div class="action-name">
                    Recevoir
                </div>

            </div>


            <div class="action">

                <div class="action-button">
                    ₣
                </div>

                <div class="action-name">
                    Payer
                </div>

            </div>


            <div class="action">

                <div class="action-button">
                    💳
                </div>

                <div class="action-name">
                    Carte
                </div>

            </div>

        </section>

    </main>

</body>

</html>
