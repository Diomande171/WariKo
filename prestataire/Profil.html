<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WariKo - Mon profil</title>

    <link rel="stylesheet" href="../style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .profile-header {
            background: var(--violet-fonce);
            color: var(--blanc);
            padding: 22px 20px 34px;
            border-radius: 0 0 30px 30px;
            text-align: center;
        }

        .profile-header .back-button {
            display: block;
            text-align: left;
            color: var(--blanc);
            text-decoration: none;
            font-size: 14px;
            opacity: 0.85;
            margin-bottom: 10px;
        }

        .avatar-wrapper {
            position: relative;
            width: 84px;
            margin: 10px auto 0;
        }

        .avatar {
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-size: 30px;
            font-weight: 800;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-edit {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--violet-fonce);
            border: 2px solid var(--blanc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            cursor: pointer;
        }

        .avatar-edit input {
            display: none;
        }

        .profile-header h1 {
            margin-top: 14px;
            font-size: 20px;
        }

        .profile-header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .metier-badge {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 20px;
            background: var(--jaune);
            color: var(--violet-fonce);
        }

        .profile-form {
            padding: 24px 20px;
        }

        .profile-form label {
            display: block;
            margin-top: 18px;
            font-size: 13px;
            color: var(--gris-texte);
        }

        .profile-form input,
        .profile-form select,
        .profile-form textarea {
            width: 100%;
            margin-top: 8px;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid #EEEEEE;
            background: var(--gris);
            color: var(--texte);
            outline: none;
            font-family: inherit;
            font-size: 14px;
        }

        .profile-form textarea {
            min-height: 90px;
            resize: vertical;
        }

        .profile-form input:disabled {
            color: var(--gris-texte);
            background: #EFEFEF;
        }

        .save-button {
            width: 100%;
            margin-top: 26px;
            padding: 15px;
            border-radius: 14px;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-weight: 800;
            font-size: 15px;
            text-align: center;
            border: none;
        }

        .logout-button {
            width: 100%;
            margin-top: 14px;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #E23744;
            background: transparent;
            color: #E23744;
            font-weight: 700;
            font-size: 15px;
            text-align: center;
        }

        #status-message {
            margin-top: 14px;
            font-size: 13px;
            text-align: center;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 430px;
            margin: 0 auto;
            background: var(--violet-fonce);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .bottom-nav a {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 11px;
            text-align: center;
        }

        .bottom-nav a.active {
            color: var(--jaune);
        }

        .app {
            padding-bottom: 70px;
        }
    </style>

</head>


<body>

    <div class="app">

        <header class="profile-header">

            <a href="index.html" class="back-button">← Retour</a>

            <div class="avatar-wrapper">
                <div class="avatar" id="avatar-display">
                    <span id="avatar-initials">?</span>
                </div>
                <label class="avatar-edit">
                    📷
                    <input type="file" id="avatar-input" accept="image/*">
                </label>
            </div>

            <h1 id="profile-name">Chargement...</h1>
            <p id="profile-email"></p>

            <span class="metier-badge" id="metier-badge" style="display:none;"></span>

        </header>


        <section class="profile-form">

            <form id="profile-form">

                <label for="fullname">Nom complet</label>
                <input id="fullname" type="text" required>

                <label for="phone">Téléphone</label>
                <input id="phone" type="tel" required>

                <label for="email">E-mail</label>
                <input id="email" type="email" disabled>

                <label for="metier">Métier</label>
                <select id="metier" required>
                    <option value="">Choisir un métier</option>
                    <option value="plombier">Plombier</option>
                    <option value="electricien">Électricien</option>
                    <option value="menuisier">Menuisier</option>
                    <option value="peintre">Peintre</option>
                    <option value="macon">Maçon</option>
                    <option value="mecanicien">Mécanicien</option>
                    <option value="coiffeur">Coiffeur / Coiffeuse</option>
                    <option value="couturier">Couturier / Couturière</option>
                    <option value="cordonnier">Cordonnier</option>
                    <option value="reparation_informatique">Réparateur informatique / téléphone</option>
                    <option value="photographe">Photographe</option>
                    <option value="traiteur">Traiteur</option>
                    <option value="menage">Ménage / Nettoyage</option>
                    <option value="demenagement">Déménagement</option>
                    <option value="jardinier">Jardinier</option>
                    <option value="climatisation">Climatisation / Frigoriste</option>
                    <option value="soudeur">Soudeur</option>
                    <option value="vitrier">Vitrier</option>
                    <option value="autre">Autre</option>
                </select>

                <label for="description">Description</label>
                <textarea id="description" placeholder="Présente ton expérience et tes services"></textarea>

                <p id="status-message"></p>

                <button type="submit" class="save-button">
                    Enregistrer les modifications
                </button>

            </form>

            <button id="logout-btn" class="logout-button">
                Se déconnecter
            </button>

        </section>

    </div>


    <nav class="bottom-nav">
        <a href="index.html">🏠<br>Accueil</a>
        <a href="position.html">📍<br>Position</a>
        <a href="profil.html" class="active">👤<br>Profil</a>
    </nav>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById("profile-form");
        const statusMessage = document.getElementById("status-message");
        const avatarDisplay = document.getElementById("avatar-display");
        const avatarInput = document.getElementById("avatar-input");
        const metierBadge = document.getElementById("metier-badge");

        let userId = null;
        let prestataireId = null;

        const labelsMetier = {
            plombier: "Plombier", electricien: "Électricien", menuisier: "Menuisier",
            peintre: "Peintre", macon: "Maçon", mecanicien: "Mécanicien",
            coiffeur: "Coiffeur / Coiffeuse", couturier: "Couturier / Couturière",
            cordonnier: "Cordonnier", reparation_informatique: "Réparateur informatique / téléphone",
            photographe: "Photographe", traiteur: "Traiteur", menage: "Ménage / Nettoyage",
            demenagement: "Déménagement", jardinier: "Jardinier", climatisation: "Climatisation / Frigoriste",
            soudeur: "Soudeur", vitrier: "Vitrier", autre: "Autre"
        };

        function afficherAvatar(url, fullName) {
            if (url) {
                avatarDisplay.innerHTML = `<img src="${url}" alt="Photo de profil">`;
            } else {
                const initials = fullName
                    ? fullName.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase()
                    : "?";
                avatarDisplay.innerHTML = `<span id="avatar-initials">${initials}</span>`;
            }
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                window.location.href = "../client/connexion.html";
                return;
            }

            const user = session.user;
            userId = user.id;

            const fullName = user.user_metadata.full_name || "";
            const phone = user.user_metadata.phone || "";
            const email = user.email;
            const avatarUrl = user.user_metadata.avatar_url || "";

            document.getElementById("fullname").value = fullName;
            document.getElementById("phone").value = phone;
            document.getElementById("email").value = email;

            document.getElementById("profile-name").textContent = fullName || "Prestataire WariKo";
            document.getElementById("profile-email").textContent = email;

            afficherAvatar(avatarUrl, fullName);

            const { data: prestataire } = await supabaseClient
                .from("prestataires")
                .select("*")
                .eq("user_id", userId)
                .maybeSingle();

            if (prestataire) {
                prestataireId = prestataire.id;
                document.getElementById("metier").value = prestataire.metier || "";
                document.getElementById("description").value = prestataire.description || "";

                if (prestataire.metier) {
                    metierBadge.textContent = labelsMetier[prestataire.metier] || prestataire.metier;
                    metierBadge.style.display = "inline-block";
                }
            }
        })();

        avatarInput.addEventListener("change", async () => {
            const fichier = avatarInput.files[0];
            if (!fichier || !userId) return;

            avatarDisplay.style.opacity = "0.5";

            try {
                const chemin = `${userId}/avatar_${Date.now()}.${fichier.name.split('.').pop()}`;

                const { error: uploadError } = await supabaseClient.storage
                    .from("avatars")
                    .upload(chemin, fichier);

                if (uploadError) {
                    alert("Erreur upload : " + uploadError.message);
                    avatarDisplay.style.opacity = "1";
                    return;
                }

                const { data: urlData } = supabaseClient.storage
                    .from("avatars")
                    .getPublicUrl(chemin);

                const { error: updateError } = await supabaseClient.auth.updateUser({
                    data: { avatar_url: urlData.publicUrl }
                });

                if (updateError) {
                    alert("Erreur : " + updateError.message);
                    avatarDisplay.style.opacity = "1";
                    return;
                }

                const fullName = document.getElementById("fullname").value;
                afficherAvatar(urlData.publicUrl, fullName);
                avatarDisplay.style.opacity = "1";

            } catch (err) {
                alert("Erreur inattendue : " + err.message);
                avatarDisplay.style.opacity = "1";
            }
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            statusMessage.textContent = "";

            const fullname = document.getElementById("fullname").value;
            const phone = document.getElementById("phone").value;
            const metier = document.getElementById("metier").value;
            const description = document.getElementById("description").value;

            const { error: authError } = await supabaseClient.auth.updateUser({
                data: {
                    full_name: fullname,
                    phone: phone
                }
            });

            let prestataireError = null;

            if (prestataireId) {
                const { error } = await supabaseClient
                    .from("prestataires")
                    .update({ metier, description, telephone: phone })
                    .eq("id", prestataireId);
                prestataireError = error;
            }

            if (authError || prestataireError) {
                statusMessage.style.color = "red";
                statusMessage.textContent = "Erreur : " + (authError?.message || prestataireError?.message);
            } else {
                statusMessage.style.color = "green";
                statusMessage.textContent = "Profil mis à jour ✓";

                document.getElementById("profile-name").textContent = fullname;
                metierBadge.textContent = labelsMetier[metier] || metier;
                metierBadge.style.display = "inline-block";

                const avatarImg = avatarDisplay.querySelector("img");
                if (!avatarImg) {
                    afficherAvatar(null, fullname);
                }
            }
        });

        document.getElementById("logout-btn").addEventListener("click", async () => {
            await supabaseClient.auth.signOut();
            window.location.href = "../client/connexion.html";
        });
    </script>

</body>

</html>
