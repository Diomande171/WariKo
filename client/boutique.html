    <style>
        body {
            background: var(--violet-fonce);

        .app {
            background: var(--violet-fonce);

        .header {

        .back-link {

        .boutique-header {
            margin-top: 16px;

        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .boutique-header h1 {
            font-size: 19px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .categorie-tag {
            font-size: 11px;
            font-weight: 700;
            color: var(--violet-fonce);
            opacity: 0.75;
            margin-top: 4px;
            display: block;
        }

        .badge {
            flex-shrink: 0;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: var(--violet-fonce);
            color: var(--jaune);
            white-space: nowrap;
        }

        .description {
            margin-top: 12px;
            font-size: 13px;
            color: var(--violet-fonce);

        }

        .contact-btn {
            margin-top: 16px;
            display: block;
            width: 100%;
            background: var(--violet-fonce);
            color: var(--jaune);
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 13px;
            font-weight: 800;
            font-family: inherit;
            text-align: center;
            text-decoration: none;
        }

        .section {
            padding: 20px 20px 0;
        }

        .section-title {
            font-size: 14px;
            font-weight: 800;
            color: var(--blanc);
            margin-bottom: 12px;
        }

        .produit-card {
            background: var(--jaune);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .produit-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .produit-nom {
            font-size: 15px;
            font-weight: 800;
            color: var(--violet-fonce);
        }

        .produit-prix {
            font-size: 14px;
            font-weight: 800;
            color: var(--violet-fonce);
            white-space: nowrap;
        }

        .produit-desc {
            margin-top: 6px;
            font-size: 12px;
            color: var(--violet-fonce);
            opacity: 0.8;
        }

        .produit-statut {
            display: inline-block;
            margin-top: 10px;
            font-size: 11px;
            font-weight: 800;
            color: var(--violet-fonce);
            background: rgba(255, 255, 255, 0.4);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .produit-statut.epuise, .produit-statut.vendu {
            opacity: 0.6;
        }

        .empty {
            color: var(--blanc);
            opacity: 0.6;
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
        }
    </style>

</head>
