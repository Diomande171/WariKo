<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WariKo - Marketplace</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        html, body {
            overflow-x: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
            padding-bottom: 110px;
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            width: 100%;
        }

        /* ---------- En-tête ---------- */
        .header {
            padding: 20px 20px 16px;
            color: var(--blanc);
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .header-top-row h1 {
            font-size: 24px;
            font-weight: 800;
        }

        .btn-ouvrir-boutique {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--jaune);
            color: var(--violet-fonce);
            font-size: 12px;
            font-weight: 800;
            padding: 10px 14px;
            border-radius: 12px;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-ouvrir-boutique svg {
            width: 15px;
            height: 15px;
            stroke: var(--violet-fonce);
        }

        /* ---------- Recherche ---------- */
        .search-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .search-bar {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
        }

        .search-bar svg {
            width: 17px;
            height: 17px;
            stroke: rgba(255, 255, 255, 0.5);
            flex-shrink: 0;
        }

        .search-bar input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--blanc);
            font-size: 13px;
            font-family: inherit;
            min-width: 0;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.45);
        }

        .btn-filtre {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-filtre svg {
            width: 18px;
            height: 18px;
            stroke: var(--blanc);
        }

        /* ---------- Catégories ---------- */
        .categories-filter {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 16px 0 0;
            margin: 0 20px;
            scrollbar-width: none;
        }

        .categories-filter::-webkit-scrollbar {
            display: none;
        }

        .filter-chip {
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.08);
            color: var(--blanc);
            font-size: 12px;
            font-weight: 700;
            padding: 9px 16px;
            border-radius: 20px;
            border: none;
            font-family: inherit;
        }

        .filter-chip.active {
            background: var(--jaune);
            color: var(--violet-fonce);
        }

        /* ---------- Sections génériques ---------- */
        .section {
            padding: 22px 20px 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-head h2 {
            font-size: 16px;
            font-weight: 800;
            color: var(--blanc);
        }

        .section-head .voir-tout {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* ---------- Boutiques populaires ---------- */
        .boutiques-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .boutiques-scroll::-webkit-scrollbar {
            display: none;
        }

        .carte-boutique {
            flex-shrink: 0;
            width: 165px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            padding: 14px;
            text-decoration: none;
            display: block;
        }

        .badge-boutique {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 9px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--jaune);
            margin-bottom: 12px;
        }

        .badge-boutique.top { color: var(--jaune); }
        .badge-boutique.nouveau { color: #C6A6FF; }

        .logo-boutique-wrapper {
            position: relative;
            width: 68px;
            height: 68px;
            margin: 0 auto 12px;
        }

        .logo-boutique {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--violet-fonce);
            color: var(--blanc);
            font-size: 13px;
            font-weight: 800;
            overflow: hidden;
            text-align: center;
            padding: 4px;
        }

        .logo-boutique img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carte-boutique h3 {
            font-size: 14px;
            font-weight: 800;
            color: var(--blanc);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .carte-boutique .categorie-tag {
            display: block;
            text-align: center;
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 2px;
        }

        .carte-boutique .rating-loc {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .carte-boutique .rating-loc .etoile { color: var(--jaune); }

        .btn-voir-boutique {
            display: block;
            margin-top: 12px;
            text-align: center;
            background: #5B3FA6;
            color: var(--blanc);
            font-size: 11.5px;
            font-weight: 700;
            padding: 9px 6px;
            border-radius: 10px;
        }

        /* ---------- Produits en vedette ---------- */
        .carte-produit {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 10px;
            text-decoration: none;
        }

        .image-produit {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: var(--blanc);
            flex-shrink: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-produit img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .infos-produit {
            flex: 1;
            min-width: 0;
        }

        .infos-produit h3 {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--blanc);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .infos-produit .nom-boutique-produit {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 2px;
        }

        .infos-produit .note-produit {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 3px;
        }

        .note-produit .etoile { color: var(--jaune); }

        .droite-produit {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .prix-produit {
            font-size: 13px;
            font-weight: 800;
            color: var(--jaune);
            white-space: nowrap;
        }

        .btn-favori {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-favori svg {
            width: 15px;
            height: 15px;
            stroke: rgba(255, 255, 255, 0.7);
        }

        /* ---------- Bandeau confiance ---------- */
        .bandeau-confiance {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px;
            margin: 16px 0;
        }

        .bandeau-confiance .icone-shield {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bandeau-confiance .icone-shield svg {
            width: 34px;
            height: 34px;
            stroke: var(--jaune);
        }

        .bandeau-confiance .texte-confiance {
            flex: 1;
        }

        .bandeau-confiance h4 {
            font-size: 13.5px;
            font-weight: 800;
            color: var(--blanc);
        }

        .bandeau-confiance p {
            font-size: 11.5px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
        }

        .fleche-confiance {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #5B3FA6;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .fleche-confiance svg {
            width: 17px;
            height: 17px;
            stroke: var(--blanc);
        }

        .empty {
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            padding: 30px 20px;
            font-size: 13px;
        }

        /* ---------- Bottom nav (corrigée) ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0 !important;
            right: 0;
            top: auto !important;
            width: auto;
            max-width: 430px;
            height: auto !important;
            margin: 0 auto;
            background: var(--violet-fonce);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            overflow: hidden;
            transform: none !important;
            z-index: 100;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .bottom-nav a {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 9.5px !important;
            letter-spacing: -0.2px;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            padding: 10px 1px 8px;
            white-space: nowrap;
        }

        .bottom-nav a svg {
            width: 21px;
            height: 21px;
            stroke: rgba(255, 255, 255, 0.6);
        }

        .bottom-nav a.active {
            color: var(--jaune) !important;
            font-weight: normal !important;
        }

        .bottom-nav a.active svg {
            stroke: var(--jaune);
        }
    </style>

</head>

    <script>
        history.scrollRestoration = "manual";
        window.scrollTo(0, 0);

        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function bientotDisponible() {
            alert("Bientôt disponible ✨");
        }

        function formatPrix(prix) {
            return Number(prix || 0).toLocaleString("fr-FR") + " FCFA";
        }

        function initiales(nom) {
            return nom
                ? nom.split(" ").map(n => n[0]).join("").substring(0, 2).toUpperCase()
                : "?";
        }

        const categorieLabels = {
            telephones: "Téléphones & Accessoires",
            mode: "Mode & Accessoires",
            electronique: "Électronique",
            maison: "Maison",
            beaute: "Beauté"
        };

        let toutesLesBoutiques = [];
        let notesBoutiques = {};

        // ---------- Boutiques populaires ----------
        async function chargerBoutiques() {
            const conteneur = document.getElementById("listeBoutiques");

            const { data, error } = await supabaseClient
                .from("boutiques_publiques")
                .select("*")
                .order("mise_en_avant", { ascending: false })
                .order("id", { ascending: false })
                .limit(10);

            if (error) {
                conteneur.innerHTML = '<p class="empty">Erreur de chargement.</p>';
                return;
            }

            toutesLesBoutiques = data || [];

            // Notes moyennes (best effort, ignore si la table avis n'est pas accessible)
            try {
                const ids = toutesLesBoutiques.map(b => String(b.id));
                if (ids.length > 0) {
                    const { data: avis } = await supabaseClient
                        .from("avis")
                        .select("cible_id, note")
                        .eq("cible_type", "boutique")
                        .in("cible_id", ids);

                    (avis || []).forEach(a => {
                        if (!notesBoutiques[a.cible_id]) notesBoutiques[a.cible_id] = [];
                        notesBoutiques[a.cible_id].push(a.note);
                    });
                }
            } catch (e) {}

            afficherBoutiques(toutesLesBoutiques);
        }

        function afficherBoutiques(liste) {
            const conteneur = document.getElementById("listeBoutiques");

            if (!liste || liste.length === 0) {
                conteneur.innerHTML = '<p class="empty">Aucune boutique pour le moment</p>';
                return;
            }

            conteneur.innerHTML = liste.map(b => {
                const notes = notesBoutiques[String(b.id)] || [];
                const moyenne = notes.length > 0 ? (notes.reduce((s, n) => s + n, 0) / notes.length).toFixed(1) : null;

                let badgeHtml = "";
                if (b.mise_en_avant) {
                    badgeHtml = '<span class="badge-boutique top">★ Top vendeur</span>';
                } else {
                    const creePeuAvant = b.created_at && (Date.now() - new Date(b.created_at).getTime()) < 1000 * 60 * 60 * 24 * 30;
                    if (creePeuAvant) badgeHtml = '<span class="badge-boutique nouveau">✦ Nouveau</span>';
                }

                return `
                    <a href="boutique.html?id=${b.id}" class="carte-boutique">
                        ${badgeHtml}
                        <div class="logo-boutique-wrapper">
                            <div class="logo-boutique">
                                ${b.logo_url ? `<img src="${b.logo_url}" alt="${b.nom_boutique}">` : initiales(b.nom_boutique)}
                            </div>
                        </div>
                        <h3>${b.nom_boutique}</h3>
                        <span class="categorie-tag">${categorieLabels[b.categorie] || b.categorie || ""}</span>
                        <div class="rating-loc">
                            ${moyenne ? `<span class="etoile">★</span> ${moyenne} (${notes.length}) •` : ""}
                            📍 Abidjan
                        </div>
                        <span class="btn-voir-boutique">Voir la boutique</span>
                    </a>
                `;
            }).join("");
        }

        // ---------- Produits en vedette ----------
        async function chargerProduits() {
            const conteneur = document.getElementById("listeProduits");

            const { data, error } = await supabaseClient
                .from("produits")
                .select("*, boutiques(nom_boutique)")
                .order("mise_en_avant", { ascending: false })
                .order("id", { ascending: false })
                .limit(5);

            if (error) {
                conteneur.innerHTML = '<p class="empty">Erreur de chargement.</p>';
                return;
            }

            const produits = data || [];

            if (produits.length === 0) {
                conteneur.innerHTML = '<p class="empty">Aucun produit pour le moment</p>';
                return;
            }

            let notesProduits = {};
            try {
                const ids = produits.map(p => String(p.id));
                const { data: avis } = await supabaseClient
                    .from("avis")
                    .select("cible_id, note")
                    .eq("cible_type", "produit")
                    .in("cible_id", ids);

                (avis || []).forEach(a => {
                    if (!notesProduits[a.cible_id]) notesProduits[a.cible_id] = [];
                    notesProduits[a.cible_id].push(a.note);
                });
            } catch (e) {}

            conteneur.innerHTML = produits.map(p => {
                const notes = notesProduits[String(p.id)] || [];
                const moyenne = notes.length > 0 ? (notes.reduce((s, n) => s + n, 0) / notes.length).toFixed(1) : null;

                return `
                    <a href="boutique.html?id=${p.boutique_id || ''}" class="carte-produit">
                        <div class="image-produit">
                            ${p.image_url ? `<img src="${p.image_url}" alt="${p.nom}">` : ""}
                        </div>
                        <div class="infos-produit">
                            <h3>${p.nom}</h3>
                            <div class="nom-boutique-produit">${p.boutiques ? p.boutiques.nom_boutique : ""}</div>
                            ${moyenne ? `<div class="note-produit"><span class="etoile">★</span> ${moyenne}</div>` : ""}
                        </div>
                        <div class="droite-produit">
                            <span class="prix-produit">${formatPrix(p.prix)}</span>
                            <button class="btn-favori" onclick="event.preventDefault(); bientotDisponible()">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
                                </svg>
                            </button>
                        </div>
                    </a>
                `;
            }).join("");
        }

        document.getElementById("filtres").addEventListener("click", function (e) {
            const btn = e.target.closest(".filter-chip");
            if (!btn) return;

            document.querySelectorAll(".filter-chip").forEach(c => c.classList.remove("active"));
            btn.classList.add("active");

            const cat = btn.dataset.cat;
            if (cat === "tout") {
                afficherBoutiques(toutesLesBoutiques);
            } else {
                afficherBoutiques(toutesLesBoutiques.filter(b => b.categorie === cat));
            }
        });

        chargerBoutiques();
        chargerProduits();
    </script>

</body>

</html>
