<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Connexion</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#3D037A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WariKo">
    <link rel="apple-touch-icon" href="../assets/IMG_9862.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>

    <main class="auth-page">

        <a
            href="../index.html"
            class="back-button"
        >
            ← Retour
        </a>


        <div class="auth-logo">
            <img src="../assets/logo.svg" alt="WariKo" style="width: 110px; height: auto;">
        </div>


        <section class="auth-content">

            <h1>
                Bienvenue 👋
            </h1>

            <p>
                Connectez-vous à votre compte WariKo.
            </p>


            <form id="login-form">

                <label for="identifier">
                    E-mail
                </label>

                <input
                    id="identifier"
                    type="email"
                    placeholder="Votre e-mail"
                    required
                >


                <label for="password">
                    Mot de passe
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Votre mot de passe"
                    required
                >


                <a
                    href="#"
                    class="forgot-password"
                >
                    Mot de passe oublié ?
                </a>


                <p id="error-message" style="color: red; display: none;"></p>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Se connecter
                </button>

            </form>


            <div class="auth-divider">
                <span>OU</span>
            </div>


            <p class="create-text">
                Vous n'avez pas encore de compte ?
            </p>


            <a
                href="inscription.html"
                class="secondary-button"
            >
                Créer un compte
            </a>

        </section>


        <p class="auth-footer">
            WariKo protège vos informations personnelles.
        </p>

    </main>


    <script>
        const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const form = document.getElementById("login-form");
        const errorMessage = document.getElementById("error-message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("identifier").value;
            const password = document.getElementById("password").value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                errorMessage.textContent = "Identifiants incorrects. Réessayez.";
                errorMessage.style.display = "block";
            } else {
                window.location.href = "accueil.html";
            }
        });
    </script>

</body>

</html>
