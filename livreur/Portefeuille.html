<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portefeuille - WariKo</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="../assets/IMG_9862.png">

<link rel="stylesheet" href="../style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { max-width:430px; margin:0 auto; background:var(--violet-fonce); color:var(--blanc); font-family:'Poppins',sans-serif; padding:16px 16px 90px; }

  .top-bar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .top-bar a { color:var(--blanc); text-decoration:none; font-size:20px; }
  .top-bar h1 { font-family:'Playfair Display',serif; font-size:17px; margin:0; }

  .solde-carte { background:linear-gradient(135deg, rgba(255,209,0,0.15), rgba(255,255,255,0.05)); border:1px solid rgba(255,209,0,0.25); border-radius:18px; padding:20px; text-align:center; margin-bottom:16px; }
  .solde-label { font-size:12px; opacity:0.75; }
  .solde-montant { font-family:'Playfair Display',serif; font-size:30px; font-weight:800; color:var(--jaune); margin:6px 0; }
  .solde-note { font-size:11px; opacity:0.6; }

  .btn-retrait { width:100%; background:var(--jaune); color:var(--violet-fonce); border:none; border-radius:30px; padding:13px; font-size:14px; font-weight:800; font-family:inherit; margin-bottom:18px; }

  .stats-row { display:flex; gap:10px; margin-bottom:18px; }
  .stat-carte { flex:1; background:rgba(255,255,255,0.06); border-radius:14px; padding:12px; text-align:center; }
  .stat-carte .valeur { font-size:15px; font-weight:800; color:var(--jaune); }
  .stat-carte .titre { font-size:10px; opacity:0.7; margin-top:3px; }

  .section-titre { font-size:13px; color:var(--jaune); margin:6px 0 10px; }

  .ligne-mois { display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.06); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .ligne-mois .mois { font-size:13px; font-weight:600; text-transform:capitalize; }
  .ligne-mois .details { font-size:10.5px; opacity:0.65; margin-top:2px; }
  .ligne-mois .montant { font-size:14px; font-weight:800; color:var(--jaune); }

  .empty { text-align:center; opacity:0.6; padding:40px 20px; font-size:13px; }

  .avertissement { font-size:10.5px; opacity:0.55; text-align:center; margin-top:16px; line-height:1.5; }

  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:var(--violet-fonce); border-top:1px solid rgba(255,255,255,0.1); display:flex; justify-content:space-around; padding:9px 0; }
  .bottom-nav a { display:flex; flex-direction:column; align-items:center; gap:3px; color:rgba(255,255,255,0.6); text-decoration:none; font-size:9.5px; }
  .bottom-nav a.active { color:var(--jaune); font-weight:bold; }
  .bottom-nav svg { width:20px; height:20px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">←</a>
  <h1>Portefeuille</h1>
</div>

<div id="contenu"><p class="empty">Chargement...</p></div>

<div class="bottom-nav">
  <a href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Accueil
  </a>
  <a href="nouvelles-courses.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="18" r="2.5"/><circle cx="17" cy="18" r="2.5"/><path d="M9 18h4.5l1.5-4h3l2 3"/><path d="M4 14l3-6h4l2 3h2.5"/><path d="M13 8h2.5l1.5 3"/></svg>
    Livraisons
  </a>
  <a href="portefeuille.html" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="7" cy="14" r="1"/></svg>
    Portefeuille
  </a>
  <a href="profil.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Profil
  </a>
</div>

<script>
const supabaseUrl = 'https://ezjpgnzaksygcfxxasrz.supabase.co';
const supabaseKey = 'sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC';
const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

let currentUser = null;
let monLivreur = null;

function pasEncoreDisponible(e) {
  if (e) e.preventDefault();
  alert('🚧 Cette fonctionnalité n\'est pas encore disponible.');
}

async function init() {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) {
    window.location.href = '../client/connexion.html';
    return;
  }
  currentUser = user;

  // Sécurité : select filtré par user_id — RLS "livreur_lit_sa_propre_ligne"
  // empêche de toute façon de lire la ligne d'un autre livreur.
  const { data: livreur } = await supabase
    .from('livreurs')
    .select('*')
    .eq('user_id', user.id)
    .single();

  if (!livreur) {
    window.location.href = 'inscription.html';
    return;
  }
  if (livreur.statut !== 'approuve') {
    window.location.href = 'inscription.html';
    return;
  }

  monLivreur = livreur;
  await afficherPortefeuille();
}

function montantLivraison(l) {
  if (l.prix_livraison) return l.prix_livraison;
  if (l.distance_km) return Math.round(l.distance_km * 300);
  return 0;
}

function debutJournee() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

function debutSemaine() {
  const d = new Date();
  const jour = d.getDay() === 0 ? 7 : d.getDay();
  d.setDate(d.getDate() - jour + 1);
  d.setHours(0, 0, 0, 0);
  return d.toISOString();
}

async function afficherPortefeuille() {
  const contenu = document.getElementById('contenu');

  // Sécurité : filtré par .eq('livreur_id', monLivreur.id) — un livreur ne
  // peut jamais voir ni additionner les gains d'un autre livreur.
  const { data, error } = await supabase
    .from('livraisons')
    .select('*')
    .eq('livreur_id', monLivreur.id)
    .eq('statut', 'livree')
    .order('created_at', { ascending: false });

  if (error) {
    contenu.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
    return;
  }

  const livraisons = data || [];
  const totalGeneral = livraisons.reduce((s, l) => s + montantLivraison(l), 0);
  const gainsJour = livraisons.filter(l => l.created_at >= debutJournee()).reduce((s, l) => s + montantLivraison(l), 0);
  const gainsSemaine = livraisons.filter(l => l.created_at >= debutSemaine()).reduce((s, l) => s + montantLivraison(l), 0);

  // Regroupement par mois
  const parMois = {};
  livraisons.forEach(l => {
    const d = new Date(l.created_at);
    const cle = `${d.getFullYear()}-${d.getMonth()}`;
    if (!parMois[cle]) {
      parMois[cle] = { label: d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }), total: 0, nb: 0 };
    }
    parMois[cle].total += montantLivraison(l);
    parMois[cle].nb += 1;
  });

  let historiqueHtml = '';
  const cles = Object.keys(parMois).sort().reverse();
  if (cles.length === 0) {
    historiqueHtml = '<p class="empty">Aucun gain enregistré pour le moment</p>';
  } else {
    cles.forEach(cle => {
      const m = parMois[cle];
      historiqueHtml += `
        <div class="ligne-mois">
          <div>
            <div class="mois">${m.label}</div>
            <div class="details">${m.nb} livraison${m.nb > 1 ? 's' : ''}</div>
          </div>
          <div class="montant">${m.total.toLocaleString('fr-FR')} F</div>
        </div>
      `;
    });
  }

  contenu.innerHTML = `
    <div class="solde-carte">
      <div class="solde-label">Total gagné (tout compris)</div>
      <div class="solde-montant">${totalGeneral.toLocaleString('fr-FR')} F</div>
      <div class="solde-note">100% de tes courses te reviennent — aucune commission WariKo dessus</div>
    </div>

    <button class="btn-retrait" onclick="pasEncoreDisponible()">Demander un retrait</button>

    <div class="stats-row">
      <div class="stat-carte">
        <div class="valeur">${gainsJour.toLocaleString('fr-FR')} F</div>
        <div class="titre">aujourd'hui</div>
      </div>
      <div class="stat-carte">
        <div class="valeur">${gainsSemaine.toLocaleString('fr-FR')} F</div>
        <div class="titre">cette semaine</div>
      </div>
    </div>

    <div class="section-titre">Historique par mois</div>
    ${historiqueHtml}

    <p class="avertissement">Les retraits ne sont pas encore disponibles sur l'application. Les paiements se font pour l'instant hors plateforme, directement avec le vendeur ou le client.</p>
  `;
}

init();
</script>
</body>
</html>
