<style>
  * { box-sizing: border-box; }

  body { background: var(--gris); }

  .app { min-height: 100vh; padding-bottom: 90px; font-family: 'Poppins', sans-serif; color: var(--texte); }

  .header {
    background: var(--violet-fonce);
    color: var(--blanc);
    padding: 20px 20px 34px;
    border-radius: 0 0 26px 26px;
  }
  .back-link { font-size: 14px; color: var(--blanc); opacity: 0.8; text-decoration: none; }
  .header h1 { margin-top: 12px; font-size: 24px; font-family: 'Playfair Display', serif; }
  .header h1 span { color: var(--jaune); }
  .header p { margin-top: 4px; font-size: 13px; opacity: 0.75; }

  .tabs-principaux {
    display: flex;
    background: var(--blanc);
    margin: -18px 16px 0;
    border-radius: 16px;
    padding: 5px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    position: relative;
    z-index: 2;
  }
  .tab-principal {
    flex: 1;
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 700;
    color: var(--gris-texte);
  }
  .tab-principal.actif { background: var(--jaune); color: var(--violet-fonce); }

  .filtres {
    display: flex;
    gap: 8px;
    padding: 18px 16px 4px;
    overflow-x: auto;
  }
  .filtre {
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    padding: 9px 14px;
    border-radius: 20px;
    background: var(--blanc);
    color: var(--texte);
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #eee;
  }
  .filtre.actif { background: var(--violet-fonce); color: var(--blanc); border-color: var(--violet-fonce); }
  .filtre .compteur {
    background: var(--jaune);
    color: var(--violet-fonce);
    font-size: 10px;
    font-weight: 800;
    padding: 1px 6px;
    border-radius: 10px;
  }
  .filtre.actif .compteur { background: rgba(255,255,255,0.25); color: var(--blanc); }

  .contenu { padding: 16px; }

  .titre-jour { font-size: 15px; font-weight: 800; margin: 14px 0 10px; }

  .carte-commande {
    display: flex;
    gap: 12px;
    background: var(--blanc);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .icone-vignette {
    width: 64px;
    height: 64px;
    border-radius: 12px;
    background: var(--gris);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
  }
  .infos-commande { flex: 1; min-width: 0; }
  .badge-type {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 20px;
    background: #EFE3FA;
    color: var(--violet-fonce);
    margin-bottom: 5px;
  }
  .infos-commande h3 {
    font-size: 14px;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .par-ligne {
    font-size: 12px;
    color: var(--gris-texte);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 4px;
  }
  .badge-verifie-inline { color: #4EA8FF; font-size: 12px; }
  .date-ligne {
    font-size: 11px;
    color: var(--gris-texte);
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .colonne-droite {
    text-align: right;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
  }
  .prix-commande { font-weight: 800; font-size: 14px; color: var(--texte); }
  .commission-ligne { font-size: 10px; color: var(--gris-texte); margin-top: 1px; }
  .badge-statut {
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .badge-statut.attente { background: #E3EEFF; color: #2E6BE0; }
  .badge-statut.cours { background: #FFF3D6; color: #B8860B; }
  .badge-statut.terminee { background: #DFF5E4; color: #1E7B3E; }
  .badge-statut.annulee { background: #FDE4E1; color: #D0453A; }

  .carte-panier {
    background: var(--blanc);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .carte-panier h3 { font-size: 14px; margin-bottom: 6px; }
  .carte-panier p { font-size: 12px; color: var(--gris-texte); margin: 2px 0; }
  .total-panier { font-weight: 800; color: var(--violet-fonce); margin-top: 8px; font-size: 14px; }
  .lien-boutique {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 800;
    color: var(--violet-fonce);
    text-decoration: none;
  }

  .empty { text-align: center; color: var(--gris-texte); font-size: 13px; padding: 40px 20px; }

  .bandeau-securite {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFF6E0;
    border-radius: 14px;
    padding: 14px;
    margin-top: 10px;
  }
  .bandeau-securite .icone { font-size: 22px; }
  .bandeau-securite h4 { font-size: 13px; margin-bottom: 2px; }
  .bandeau-securite p { font-size: 11px; color: var(--gris-texte); }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 430px; margin: 0 auto; background: var(--violet-fonce); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; padding: 10px 6px; }
  .bottom-nav a { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: rgba(255, 255, 255, 0.6); text-decoration: none; }
  .bottom-nav a svg { width: 22px; height: 22px; stroke: rgba(255, 255, 255, 0.6); }
  .bottom-nav a.active { color: var(--jaune); }
  .bottom-nav a.active svg { stroke: var(--jaune); }
</style>

<body>

<script>
const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function formatPrix(prix) {
  return Number(prix || 0).toLocaleString("fr-FR") + " FCFA";
}

function formatHeure(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function formatDateLigne(dateStr) {
  const d = new Date(dateStr);
  const jour = String(d.getDate()).padStart(2, "0");
  const mois = d.toLocaleDateString("fr-FR", { month: "short" });
  const annee = d.getFullYear();
  return `${jour} ${mois}. ${annee} • ${formatHeure(dateStr)}`;
}

function cleJour(dateStr) {
  const d = new Date(dateStr);
  return d.toISOString().slice(0, 10);
}

function libelleJour(dateStr) {
  const aujourdhui = cleJour(new Date().toISOString());
  const hier = new Date();
  hier.setDate(hier.getDate() - 1);
  const cleHier = cleJour(hier.toISOString());
  const cle = cleJour(dateStr);

  if (cle === aujourdhui) return "Aujourd'hui";
  if (cle === cleHier) return "Hier";

  const d = new Date(dateStr);
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
}

function normaliserEtat(statut) {
  const table = {
    en_attente: "attente",
    acceptee: "cours",
    livree: "terminee",
    terminee: "terminee",
    refusee: "annulee",
    annulee: "annulee",
    rejetee: "annulee"
  };
  return table[statut] || "cours";
}

const labelsEtat = { attente: "En attente", cours: "En cours", terminee: "Terminée", annulee: "Annulée" };

function changerTabPrincipal(nom) {
  document.querySelectorAll(".tab-principal").forEach(t => t.classList.toggle("actif", t.dataset.tab === nom));
  document.getElementById("vue-panier").style.display = nom === "panier" ? "block" : "none";
  document.getElementById("vue-commandes").style.display = nom === "commandes" ? "block" : "none";
}

let filtreActuel = "toutes";
let tousLesElements = [];

function changerFiltre(nom) {
  filtreActuel = nom;
  document.querySelectorAll(".filtre").forEach(f => f.classList.toggle("actif", f.dataset.filtre === nom));
  afficherElements();
}

// ---------- Panier (localStorage, par boutique) ----------
function chargerPaniersLocaux() {
  const conteneur = document.getElementById("listePanier");
  const paniers = [];

  for (let i = 0; i < localStorage.length; i++) {
    const cle = localStorage.key(i);
    if (cle && cle.startsWith("panier_")) {
      try {
        const lignes = JSON.parse(localStorage.getItem(cle)) || [];
        if (lignes.length > 0) {
          const boutiqueId = cle.replace("panier_", "");
          const total = lignes.reduce((s, l) => s + l.quantite * Number(l.prix), 0);
          paniers.push({ boutiqueId, lignes, total });
        }
      } catch (e) {}
    }
  }

  if (paniers.length === 0) {
    conteneur.innerHTML = '<p class="empty">Ton panier est vide.</p>';
    return;
  }

  conteneur.innerHTML = paniers.map(p => `
    <div class="carte-panier">
      <h3>Boutique</h3>
      ${p.lignes.map(l => `<p>${l.nom} × ${l.quantite}</p>`).join("")}
      <div class="total-panier">${formatPrix(p.total)}</div>
      <a class="lien-boutique" href="boutique.html?id=${p.boutiqueId}">Voir la boutique et valider →</a>
    </div>
  `).join("");
}

// ---------- Commandes + Demandes unifiées ----------
async function chargerToutesLesCommandes() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "connexion.html";
    return;
  }

  const [{ data: commandes, error: erreurCommandes }, { data: demandes, error: erreurDemandes }] = await Promise.all([
    supabaseClient
      .from("commandes")
      .select("*, boutiques(nom_boutique, identite_verifiee)")
      .eq("client_id", session.user.id),
    supabaseClient
      .from("demandes")
      .select("*, prestataires(nom, identite_verifiee)")
      .eq("client_id", session.user.id)
  ]);

  if (erreurCommandes || erreurDemandes) {
    document.getElementById("listeCommandes").innerHTML = `<p class="empty">Erreur de chargement.</p>`;
    return;
  }

  let produitsParCommande = {};
  const idsCommandes = (commandes || []).map(c => c.id);
  if (idsCommandes.length > 0) {
    const { data: lignes } = await supabaseClient
      .from("commande_produits")
      .select("*")
      .in("commande_id", idsCommandes);

    (lignes || []).forEach(l => {
      if (!produitsParCommande[l.commande_id]) produitsParCommande[l.commande_id] = [];
      produitsParCommande[l.commande_id].push(l);
    });
  }

  const elementsProduits = (commandes || []).map(c => {
    const lignes = produitsParCommande[c.id] || [];
    const titre = lignes.length > 0
      ? (lignes.length === 1 ? lignes[0].nom_produit : `${lignes.length} produits`)
      : "Commande";
    return {
      type: "produit",
      id: c.id,
      titre: titre,
      nomVendeur: c.boutiques ? c.boutiques.nom_boutique : "Boutique",
      verifie: c.boutiques ? c.boutiques.identite_verifiee : false,
      date: c.created_at,
      etat: normaliserEtat(c.statut),
      prix: c.total,
      commission: c.total ? Math.round(c.total * 0.05) : null
    };
  });

  const elementsPrestations = (demandes || []).map(d => {
    return {
      type: "prestation",
      id: d.id,
      titre: d.categorie || d.description || "Demande de prestation",
      nomVendeur: d.prestataires ? d.prestataires.nom : (d.professionnel_nom || "Prestataire"),
      verifie: d.prestataires ? d.prestataires.identite_verifiee : false,
      date: d.created_at,
      etat: normaliserEtat(d.statut),
      prix: null,
      commission: null
    };
  });

  tousLesElements = [...elementsProduits, ...elementsPrestations].sort((a, b) => new Date(b.date) - new Date(a.date));

  document.getElementById("compteur-attente").textContent = tousLesElements.filter(e => e.etat === "attente").length;
  document.getElementById("compteur-cours").textContent = tousLesElements.filter(e => e.etat === "cours").length;

  afficherElements();
}

function afficherElements() {
  const conteneur = document.getElementById("listeCommandes");

  const filtres = filtreActuel === "toutes" ? tousLesElements : tousLesElements.filter(e => e.etat === filtreActuel);

  if (filtres.length === 0) {
    conteneur.innerHTML = '<p class="empty">Aucune commande ici pour le moment.</p>';
    return;
  }

  const groupes = {};
  filtres.forEach(e => {
    const libelle = libelleJour(e.date);
    if (!groupes[libelle]) groupes[libelle] = [];
    groupes[libelle].push(e);
  });

  conteneur.innerHTML = Object.keys(groupes).map(libelle => `
    <div class="titre-jour">${libelle}</div>
    ${groupes[libelle].map(e => `
      <div class="carte-commande">
        <div class="icone-vignette">${e.type === "produit" ? "🛍️" : "🔧"}</div>
        <div class="infos-commande">
          <span class="badge-type">${e.type === "produit" ? "Produit" : "Prestation"}</span>
          <h3>${e.titre}</h3>
          <div class="par-ligne">Par ${e.nomVendeur} ${e.verifie ? '<span class="badge-verifie-inline">✔</span>' : ""}</div>
          <div class="date-ligne">📅 ${formatDateLigne(e.date)}</div>
        </div>
        <div class="colonne-droite">
          <div>
            <div class="prix-commande">${e.prix !== null ? formatPrix(e.prix) : "Prix à convenir"}</div>
            ${e.commission !== null ? `<div class="commission-ligne">Commission ${formatPrix(e.commission)}</div>` : ""}
          </div>
          <span class="badge-statut ${e.etat}">${labelsEtat[e.etat]}</span>
        </div>
      </div>
    `).join("")}
  `).join("");
}

chargerPaniersLocaux();
chargerToutesLesCommandes();
</script>
