<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Accueil</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            background: var(--violet-fonce);
        }

        .app {
            background: var(--violet-fonce);
            min-height: 100vh;
        }

        .header {
            padding: 22px 20px 26px;
            color: var(--blanc);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-bar .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--jaune);
        }

        .top-bar .notification {
            font-size: 18px;
        }

        .location {
            margin-top: 14px;
            font-size: 12px;
            opacity: 0.75;
        }

        .header h1 {
            margin-top: 10px;
            font-size: 22px;
        }

        .header p {
            margin-top: 4px;
            font-size: 13px;
            opacity: 0.75;
        }

        .search-box {
            margin-top: 18px;
            background: var(--jaune);
            border-radius: 14px;
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 14px;
            color: var(--violet-fonce);
            font-weight: 600;
            background: transparent;
            pointer-events: none;
        }

        .search-box input::placeholder {
            color: var(--violet-fonce);
            opacity: 0.65;
        }

        .
