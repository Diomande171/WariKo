<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WariKo - Connexion</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

</head>


<body>

    <main class="auth-page">

        <a
            href="../index.html"
            class="back-button"
        >
            ← Retour
        </a>


        <div class="auth-logo">
            WariKo
        </div>


        <section class="auth-content">

            <h1>
                Bienvenue 👋
            </h1>

            <p>
                Connectez-vous à votre compte WariKo.
            </p>


            <form>

                <label for="identifier">
                    Téléphone ou e-mail
                </label>

                <input
                    id="identifier"
                    type="text"
                    placeholder="Téléphone ou e-mail"
                    required
                >


                <label for="password">
                    Mot de passe
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Votre mot de passe"
                    required
                >


                <a
                    href="#"
                    class="forgot-password"
                >
                    Mot de passe oublié ?
                </a>


                <button
                    type="submit"
                    class="primary-button"
                >
                    Se connecter
                </button>

            </form>


            <div class="auth-divider">
                <span>OU</span>
            </div>


            <p class="create-text">
                Vous n'avez pas encore de compte ?
            </p>


            <a
                href="inscription.html"
                class="secondary-button"
            >
                Créer un compte
            </a>

        </section>


        <p class="auth-footer">
            WariKo protège vos informations personnelles.
        </p>

    </main>

</body>

</html>
