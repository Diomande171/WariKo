<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WariKo - Notifications</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3D037A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WariKo">
<link rel="apple-touch-icon" href="assets/IMG_9862.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body { background: var(--violet-fonce); }
.app { max-width:430px; margin:0 auto; min-height: 100vh; padding: 0 0 40px; color: var(--blanc); font-family: 'Poppins', sans-serif; }
.header { padding: 22px 20px 18px; display: flex; justify-content: space-between; align-items: center; }
.back-link { font-size: 13px; color: var(--blanc); opacity: 0.75; text-decoration: none; background: none; border: none; }
.header h1 { font-size: 20px; font-family: 'Playfair Display', serif; color: var(--jaune); }
.tout-lu { font-size: 12px; color: var(--jaune); opacity: 0.8; background: none; border: none; font-weight: 700; }

.section { padding: 0 20px; }
.carte { display: block; background: rgba(255,255,255,0.06); border-radius: 14px; padding: 14px; margin-bottom: 10px; text-decoration: none; color: var(--blanc); position: relative; }
.carte.non-lu { background: rgba(245,217,73,0.12); border: 1px solid rgba(245,217,73,0.3); }
.carte h3 { font-size: 14px; margin-bottom: 4px; color: var(--jaune); }
.carte p { font-size: 12px; opacity: 0.85; }
.carte .date { font-size: 11px; opacity: 0.5; margin-top: 6px; }
.point { position: absolute; top: 14px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--jaune); }

.empty { text-align: center; opacity: 0.5; font-size: 13px; padding: 40px 20px; }
</style>

</head>

<body>

<div class="app">

<header class="header">
<button class="back-link" onclick="history.back()">← Retour</button>
<h1>Notifications</h1>
<button class="tout-lu" onclick="toutMarquerLu()">Tout lire</button>
</header>

<section class="section" id="liste">
<p class="empty">Chargement...</p>
</section>

</div>

<script>
const SUPABASE_URL = "https://ezjpgnzaksygcfxxasrz.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hKEuNeb48yjt1sS62MeM0w_RIgTSOxC";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const liste = document.getElementById("liste");
let userId = null;

function tempsEcoule(dateStr) {
  const diff = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
  if (diff < 1) return "à l'instant";
  if (diff < 60) return diff + " min";
  if (diff < 1440) return Math.floor(diff / 60) + " h";
  return Math.floor(diff / 1440) + " j";
}

function escapeHTML(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function chargerNotifications() {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (!session) {
    window.location.href = "client/connexion.html";
    return;
  }
  userId = session.user.id;

  const { data, error } = await supabaseClient
    .from("notifications")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  if (error) {
    liste.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`;
    return;
  }

  if (!data || data.length === 0) {
    liste.innerHTML = '<p class="empty">Aucune notification pour l\'instant.</p>';
    return;
  }

  liste.innerHTML = data.map(n => `
    <a class="carte ${n.lu ? '' : 'non-lu'}" href="${n.lien ? escapeHTML(n.lien) : '#'}" onclick="marquerLu('${n.id}')">
      ${!n.lu ? '<span class="point"></span>' : ''}
      <h3>${escapeHTML(n.titre)}</h3>
      ${n.message ? `<p>${escapeHTML(n.message)}</p>` : ''}
      <div class="date">${tempsEcoule(n.created_at)}</div>
    </a>
  `).join("");
}

async function marquerLu(id) {
  await supabaseClient.from("notifications").update({ lu: true }).eq("id", id);
}

async function toutMarquerLu() {
  await supabaseClient.from("notifications").update({ lu: true }).eq("user_id", userId).eq("lu", false);
  chargerNotifications();
}

chargerNotifications();
</script>

</body>

</html>
